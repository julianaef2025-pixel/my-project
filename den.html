<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DEN</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--side:#111;--sur:#1a1a1a;--sur2:#222;
  --bor:#2a2a2a;--acc:#a855f7;--abg:rgba(168,85,247,.15);
  --tx:#e8e8e8;--mu:#666;--ubg:#1c1c2e;
}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.65}

/* Modal */
.overlay{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:1rem}
.overlay.hide{display:none}
.modal{background:var(--sur);border:1px solid var(--bor);border-radius:18px;padding:2.5rem 2rem;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:1rem;text-align:center}
.m-icon{width:56px;height:56px;background:linear-gradient(135deg,var(--acc),#7c3aed);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900;color:#fff}
.modal h2{font-size:1.3rem;font-weight:700}
.modal p{color:var(--mu);font-size:.88rem}
.modal input{width:100%;padding:.7rem 1rem;background:var(--sur2);border:1px solid var(--bor);border-radius:10px;color:var(--tx);font-size:.95rem;outline:none;transition:border-color .2s;font-family:monospace}
.modal input:focus{border-color:var(--acc)}
.modal input::placeholder{color:var(--mu);font-family:inherit}
.merr{color:#f87171;font-size:.82rem;min-height:1.1em}
.mbtn{width:100%;padding:.75rem;background:var(--acc);border:none;border-radius:10px;color:#fff;font-size:.95rem;font-weight:600;cursor:pointer;transition:opacity .15s}
.mbtn:hover{opacity:.87}
.mhint{font-size:.77rem;color:var(--mu)}

/* Layout */
.app{display:flex;height:100vh;overflow:hidden}

/* Sidebar */
.sidebar{width:250px;min-width:250px;background:var(--side);border-right:1px solid var(--bor);display:flex;flex-direction:column;padding:1rem;overflow-y:auto}
.brand{display:flex;align-items:center;gap:.55rem;margin-bottom:.65rem}
.b-icon{width:30px;height:30px;background:linear-gradient(135deg,var(--acc),#7c3aed);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:.9rem}
.b-name{font-size:1.05rem;font-weight:700}
.new-btn{display:flex;align-items:center;gap:.45rem;width:100%;padding:.5rem .8rem;background:var(--sur);border:1px solid var(--bor);border-radius:9px;color:var(--tx);font-size:.84rem;font-weight:500;cursor:pointer;margin-bottom:.5rem;transition:background .15s}
.new-btn:hover{background:var(--sur2)}
.hlist{flex:1;display:flex;flex-direction:column;gap:2px}
.hitem{padding:.42rem .7rem;border-radius:7px;font-size:.8rem;color:var(--mu);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s,color .15s}
.hitem:hover{background:var(--sur);color:var(--tx)}
.hitem.on{background:var(--abg);color:var(--tx)}
.key-btn{margin-top:auto;padding:.4rem;background:none;border:none;color:var(--mu);font-size:.74rem;cursor:pointer;transition:color .15s}
.key-btn:hover{color:var(--tx)}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:50px;min-height:50px;border-bottom:1px solid var(--bor);display:flex;align-items:center;padding:0 1.5rem}
.badge{font-size:.78rem;font-weight:600;color:var(--acc);background:var(--abg);padding:.18rem .6rem;border-radius:20px;letter-spacing:.04em}

/* Welcome */
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;padding:2rem;text-align:center}
.w-icon{width:60px;height:60px;background:linear-gradient(135deg,var(--acc),#7c3aed);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900;color:#fff;box-shadow:0 0 36px rgba(168,85,247,.28)}
.welcome h1{font-size:1.5rem;font-weight:700}
.welcome>p{color:var(--mu)}
.pills{display:flex;flex-wrap:wrap;gap:.55rem;justify-content:center;max-width:580px;margin-top:.35rem}
.pill{padding:.43rem .9rem;background:var(--sur);border:1px solid var(--bor);border-radius:20px;color:var(--tx);font-size:.8rem;cursor:pointer;transition:background .15s}
.pill:hover{background:var(--sur2)}

/* Thread */
.thread{flex:1;overflow-y:auto;padding:1.25rem 0;display:none;flex-direction:column;scrollbar-width:thin;scrollbar-color:var(--sur2) transparent}
.thread.show{display:flex}
.row{display:flex;gap:.85rem;padding:.6rem 1.75rem;max-width:760px;width:100%;margin:0 auto}
.row.u{justify-content:flex-end}
.row.a{justify-content:flex-start}
.av{width:30px;height:30px;min-width:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0;margin-top:2px}
.a .av{background:linear-gradient(135deg,var(--acc),#7c3aed);color:#fff}
.u .av{background:var(--sur2);border:1px solid var(--bor);color:var(--mu)}
.bub{max-width:600px;font-size:.93rem;line-height:1.7;border-radius:12px}
.u .bub{background:var(--ubg);border:1px solid #2b2b46;padding:.75rem 1rem;border-radius:12px 12px 4px 12px;white-space:pre-wrap;word-break:break-word}
.a .bub{background:transparent}

/* Markdown */
.bub p{margin-bottom:.6rem}.bub p:last-child{margin-bottom:0}
.bub h1{font-size:1.15rem;font-weight:700;margin:.9rem 0 .3rem}
.bub h2{font-size:1rem;font-weight:700;margin:.8rem 0 .3rem}
.bub h3{font-size:.93rem;font-weight:700;margin:.7rem 0 .25rem}
.bub ul,.bub ol{padding-left:1.35rem;margin-bottom:.6rem}
.bub li{margin-bottom:.2rem}
.bub strong{font-weight:600;color:#f0f0f0}
.bub em{font-style:italic;color:#ccc}
.bub a{color:var(--acc);text-decoration:none}
.bub a:hover{text-decoration:underline}
.bub blockquote{border-left:3px solid var(--acc);padding-left:.8rem;color:var(--mu);margin:.5rem 0;font-style:italic}
.bub hr{border:none;border-top:1px solid var(--bor);margin:.65rem 0}
.cwrap{position:relative;margin:.6rem 0}
.bub pre{background:#141414;border:1px solid var(--bor);border-radius:10px;padding:1rem;overflow-x:auto;font-size:.83rem;line-height:1.55;margin:0}
.bub code{font-family:'SF Mono','Fira Code','Consolas',monospace}
.bub :not(pre)>code{background:#1e1e1e;border:1px solid #333;border-radius:5px;padding:.1em .38em;font-size:.84em;color:#d8a8ff}
.cpbtn{position:absolute;top:.5rem;right:.5rem;background:var(--sur2);border:1px solid var(--bor);border-radius:6px;color:var(--mu);font-size:.7rem;padding:.18rem .48rem;cursor:pointer;opacity:0;transition:opacity .15s;font-family:inherit}
.cwrap:hover .cpbtn{opacity:1}
.cpbtn:hover{color:var(--tx)}

/* Typing */
.dots span{display:inline-block;width:6px;height:6px;background:var(--mu);border-radius:50%;margin:0 2px;animation:bob 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes bob{0%,80%,100%{opacity:.2;transform:translateY(0)}40%{opacity:1;transform:translateY(-5px)}}

/* Input */
.iarea{padding:.85rem 1.5rem 1.1rem;border-top:1px solid var(--bor);display:flex;flex-direction:column;align-items:center;gap:.45rem}
.ibox{display:flex;align-items:flex-end;gap:.5rem;width:100%;max-width:720px;background:var(--sur);border:1px solid var(--bor);border-radius:14px;padding:.6rem .6rem .6rem 1rem;transition:border-color .2s}
.ibox:focus-within{border-color:var(--acc)}
textarea{flex:1;background:transparent;border:none;outline:none;resize:none;color:var(--tx);font-size:.93rem;font-family:inherit;line-height:1.6;max-height:200px;overflow-y:auto;scrollbar-width:thin}
textarea::placeholder{color:var(--mu)}
.sbtn{width:36px;height:36px;min-width:36px;border-radius:9px;border:none;background:var(--acc);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .15s,transform .1s;flex-shrink:0}
.sbtn:disabled{opacity:.35;cursor:not-allowed}
.sbtn:not(:disabled):hover{opacity:.85}
.sbtn:not(:disabled):active{transform:scale(.92)}
.disc{font-size:.71rem;color:var(--mu)}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--sur2);border-radius:3px}

@media(max-width:600px){
  .sidebar{display:none}
  .row{padding:.55rem .9rem}
  .iarea{padding:.7rem .9rem .9rem}
}
</style>
</head>
<body>

<!-- Key Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="m-icon">D</div>
    <h2>Welcome to DEN</h2>
    <p>Enter your free Groq API key. It stays in your browser — never sent anywhere else.</p>
    <input type="password" id="keyInput" placeholder="gsk_..." autocomplete="off"/>
    <p class="merr" id="merr"></p>
    <button class="mbtn" id="saveBtn">Start chatting</button>
    <p class="mhint">Get a free key at console.groq.com → API Keys</p>
  </div>
</div>

<!-- App -->
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="b-icon">D</div>
      <span class="b-name">DEN</span>
    </div>
    <button class="new-btn" id="newBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New chat
    </button>
    <div class="hlist" id="hlist"></div>
    <button class="key-btn" id="keyBtn">Change API key</button>
  </aside>

  <main class="main">
    <header class="topbar"><span class="badge">DEN AI</span></header>

    <div class="welcome" id="welcome">
      <div class="w-icon">D</div>
      <h1>How can I help you?</h1>
      <p>Ask me anything — coding, writing, math, ideas, analysis.</p>
      <div class="pills">
        <button class="pill" data-q="Explain quantum entanglement in simple terms">Explain quantum entanglement</button>
        <button class="pill" data-q="Write a Python function to sort a list of dictionaries by a key">Sort dicts in Python</button>
        <button class="pill" data-q="What are the pros and cons of microservices architecture?">Microservices pros & cons</button>
        <button class="pill" data-q="Help me write a professional email declining a job offer politely">Decline a job offer</button>
      </div>
    </div>

    <div class="thread" id="thread"></div>

    <div class="iarea">
      <div class="ibox">
        <textarea id="txt" placeholder="Message DEN…" rows="1"></textarea>
        <button class="sbtn" id="sbtn" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <p class="disc">DEN can make mistakes. Verify important info.</p>
    </div>
  </main>
</div>

<script>
'use strict';

// ── Key management ─────────────────────────────────────────────────────────────
const overlay = document.getElementById('overlay');
const keyInput = document.getElementById('keyInput');
const saveBtn  = document.getElementById('saveBtn');
const merr     = document.getElementById('merr');
const keyBtn   = document.getElementById('keyBtn');

let KEY = localStorage.getItem('groq_key') || '';

function openModal() {
  keyInput.value = '';
  merr.textContent = '';
  overlay.classList.remove('hide');
  setTimeout(() => keyInput.focus(), 50);
}
function closeModal() { overlay.classList.add('hide'); }

if (KEY) closeModal(); else openModal();

function saveKey() {
  const v = keyInput.value.trim();
  if (!v) { merr.textContent = 'Please paste your API key'; return; }
  KEY = v;
  localStorage.setItem('groq_key', v);
  closeModal();
  txt.focus();
}

saveBtn.onclick = saveKey;
keyInput.onkeydown = e => { if (e.key === 'Enter') saveKey(); };
keyBtn.onclick = openModal;

// ── State ──────────────────────────────────────────────────────────────────────
let sessions = [];
let curId    = null;
let busy     = false;

// ── DOM ────────────────────────────────────────────────────────────────────────
const welcome = document.getElementById('welcome');
const thread  = document.getElementById('thread');
const txt     = document.getElementById('txt');
const sbtn    = document.getElementById('sbtn');
const newBtn  = document.getElementById('newBtn');
const hlist   = document.getElementById('hlist');

// ── Textarea ───────────────────────────────────────────────────────────────────
txt.oninput = () => {
  txt.style.height = 'auto';
  txt.style.height = Math.min(txt.scrollHeight, 200) + 'px';
  sbtn.disabled = !txt.value.trim() || busy;
};

txt.onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); }
};

sbtn.onclick = go;
newBtn.onclick = newChat;

document.querySelectorAll('.pill').forEach(p => {
  p.onclick = () => { txt.value = p.dataset.q; txt.oninput(); go(); };
});

// ── Chat sessions ──────────────────────────────────────────────────────────────
function newChat() {
  const id = Date.now().toString();
  sessions.unshift({ id, title: 'New chat', msgs: [] });
  curId = id;
  renderSidebar();
  welcome.style.display = 'flex';
  thread.className = 'thread';
  thread.innerHTML = '';
  txt.value = '';
  txt.style.height = 'auto';
  sbtn.disabled = true;
  txt.focus();
}

function cur() { return sessions.find(s => s.id === curId); }

function renderSidebar() {
  hlist.innerHTML = '';
  sessions.forEach(s => {
    const el = document.createElement('div');
    el.className = 'hitem' + (s.id === curId ? ' on' : '');
    el.textContent = s.title;
    el.onclick = () => loadChat(s.id);
    hlist.appendChild(el);
  });
}

function loadChat(id) {
  curId = id;
  renderSidebar();
  const s = cur();
  thread.innerHTML = '';
  if (!s.msgs.length) {
    welcome.style.display = 'flex';
    thread.className = 'thread';
    return;
  }
  welcome.style.display = 'none';
  thread.classList.add('show');
  s.msgs.forEach(m => bubble(m.role, m.content));
  thread.scrollTop = thread.scrollHeight;
}

// ── Send ───────────────────────────────────────────────────────────────────────
async function go() {
  const text = txt.value.trim();
  if (!text || busy) return;
  if (!KEY) { openModal(); return; }
  if (!curId) newChat();

  const s = cur();
  welcome.style.display = 'none';
  thread.classList.add('show');

  s.msgs.push({ role: 'user', content: text });
  bubble('user', text);

  if (s.title === 'New chat') {
    s.title = text.slice(0, 42) + (text.length > 42 ? '…' : '');
    renderSidebar();
  }

  txt.value = '';
  txt.style.height = 'auto';
  sbtn.disabled = true;
  thread.scrollTop = thread.scrollHeight;

  busy = true;
  const dots = typing();
  thread.scrollTop = thread.scrollHeight;

  try {
    const reply = await ask(s.msgs);
    dots.remove();
    s.msgs.push({ role: 'assistant', content: reply });
    bubble('assistant', reply);
  } catch (e) {
    dots.remove();
    bubble('assistant', `**Error:** ${e.message}\n\nIf your key is wrong, click **Change API key** in the sidebar.`);
  } finally {
    busy = false;
    sbtn.disabled = !txt.value.trim();
    thread.scrollTop = thread.scrollHeight;
    txt.focus();
  }
}

// ── Groq API ───────────────────────────────────────────────────────────────────
async function ask(msgs) {
  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + KEY,
    },
    body: JSON.stringify({
      model: 'llama-3.3-70b-versatile',
      messages: [
        { role: 'system', content: 'You are DEN, a highly intelligent AI assistant. Give clear, well-structured responses using markdown — headers, bullets, and code blocks where helpful.' },
        ...msgs.map(m => ({ role: m.role, content: m.content }))
      ]
    })
  });

  if (!res.ok) {
    let msg = 'Request failed';
    try { const j = await res.json(); msg = j.error?.message || msg; } catch(_){}
    throw new Error(msg);
  }

  const data = await res.json();
  return data.choices?.[0]?.message?.content || '(no response)';
}

// ── Render ─────────────────────────────────────────────────────────────────────
function bubble(role, content) {
  const row = document.createElement('div');
  row.className = 'row ' + (role === 'user' ? 'u' : 'a');

  const av = document.createElement('div');
  av.className = 'av';
  av.textContent = role === 'assistant' ? 'D' : 'U';

  const bub = document.createElement('div');
  bub.className = 'bub';

  if (role === 'assistant') {
    bub.innerHTML = markdown(content);
    bub.querySelectorAll('pre').forEach(pre => {
      const w = document.createElement('div');
      w.className = 'cwrap';
      pre.replaceWith(w);
      w.appendChild(pre);
      const cp = document.createElement('button');
      cp.className = 'cpbtn';
      cp.textContent = 'Copy';
      cp.onclick = () => {
        navigator.clipboard.writeText(pre.innerText).then(() => {
          cp.textContent = 'Copied!';
          setTimeout(() => cp.textContent = 'Copy', 1500);
        });
      };
      w.appendChild(cp);
    });
  } else {
    bub.textContent = content;
  }

  if (role === 'assistant') { row.appendChild(av); row.appendChild(bub); }
  else { row.appendChild(bub); row.appendChild(av); }
  thread.appendChild(row);
  return row;
}

function typing() {
  const row = document.createElement('div');
  row.className = 'row a';
  const av = document.createElement('div');
  av.className = 'av'; av.textContent = 'D';
  const bub = document.createElement('div');
  bub.className = 'bub';
  bub.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
  row.appendChild(av); row.appendChild(bub);
  thread.appendChild(row);
  return row;
}

// ── Markdown ───────────────────────────────────────────────────────────────────
function markdown(raw) {
  let s = raw
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  s = s.replace(/```[\w]*\n?([\s\S]*?)```/g, (_,c) => `<pre><code>${c.trimEnd()}</code></pre>`);
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  s = s.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  s = s.replace(/^## (.+)$/gm,  '<h2>$1</h2>');
  s = s.replace(/^# (.+)$/gm,   '<h1>$1</h1>');
  s = s.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  s = s.replace(/^---$/gm, '<hr>');
  s = s.replace(/^[ \t]*[-*] (.+)$/gm, '<li>$1</li>');
  s = s.replace(/^[ \t]*\d+\. (.+)$/gm, '<li>$1</li>');
  s = s.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');

  s = s.split(/\n{2,}/).map(b => {
    b = b.trim();
    if (!b) return '';
    if (/^<(h[1-3]|ul|ol|pre|blockquote|hr)/.test(b)) return b;
    return `<p>${b.replace(/\n/g,'<br>')}</p>`;
  }).join('\n');

  return s;
}

// ── Boot ───────────────────────────────────────────────────────────────────────
newChat();
</script>
</body>
</html>
