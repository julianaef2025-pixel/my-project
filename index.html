<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEN</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- API Key Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-icon">D</div>
      <h2>Welcome to DEN</h2>
      <p>Enter your Anthropic API key to get started. It's saved in your browser only.</p>
      <input type="password" id="apiKeyInput" placeholder="gsk_..." spellcheck="false" />
      <p class="modal-error" id="modalError"></p>
      <button class="modal-btn" id="modalSaveBtn">Start chatting</button>
      <p class="modal-hint">Get a free key at console.groq.com</p>
    </div>
  </div>

  <!-- App -->
  <div class="layout" id="app">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <div class="brand-icon">D</div>
          <span class="brand-name">DEN</span>
        </div>
        <button class="new-chat-btn" id="newChatBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          New chat
        </button>
      </div>
      <div class="history-list" id="historyList"></div>
      <button class="change-key-btn" id="changeKeyBtn">Change API key</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <span class="model-badge">DEN AI</span>
      </header>

      <div class="welcome" id="welcome">
        <div class="welcome-icon">D</div>
        <h1>How can I help you?</h1>
        <p>Ask me anything — writing, coding, math, analysis, ideas.</p>
        <div class="suggestions">
          <button class="pill" data-q="Explain quantum entanglement simply">Explain quantum entanglement</button>
          <button class="pill" data-q="Write a Python function to sort a list of dicts by key">Sort dicts in Python</button>
          <button class="pill" data-q="What are pros and cons of microservices?">Microservices pros & cons</button>
          <button class="pill" data-q="Help me write a professional email declining a job offer">Decline a job offer</button>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="input-area">
        <div class="input-box" id="inputBox">
          <textarea id="userInput" placeholder="Message DEN…" rows="1"></textarea>
          <button class="send-btn" id="sendBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        <p class="disclaimer">DEN can make mistakes. Verify important info.</p>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
