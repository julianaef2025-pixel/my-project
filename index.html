<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ball Drop — Selfie Game</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#07071a; --a1:#ff2d78; --a2:#00d4ff; --a3:#a855f7;
      --a4:#fbbf24; --a5:#34d399; --text:#f0f0ff; --dim:rgba(240,240,255,0.5);
    }
    html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); }
    body {
      font-family:'Segoe UI', system-ui, sans-serif;
      color:var(--text);
      display:flex; align-items:center; justify-content:center;
      padding-bottom:34px;
    }
    .screen {
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center; flex-direction:column;
      transition:opacity .4s ease, transform .4s ease; z-index:10;
    }
    .screen.hidden  { opacity:0; pointer-events:none; transform:translateY(18px); }
    .screen.active  { opacity:1; pointer-events:all; transform:translateY(0); }

    /* ── LOBBY ── */
    #s-lobby { overflow:hidden; }
    #lobby-canvas { position:absolute; inset:0; width:100%; height:100%; z-index:0; }
    .lobby-content {
      position:relative; z-index:1;
      display:flex; flex-direction:column; align-items:center;
      width:100%; max-width:500px; padding:0 20px;
    }
    .lobby-title {
      font-size:clamp(54px,13vw,82px); font-weight:900;
      letter-spacing:-3px; text-align:center; line-height:.92;
      margin-bottom:6px;
      background:linear-gradient(135deg,#ff2d78,#a855f7,#00d4ff);
      -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
      filter:drop-shadow(0 0 28px rgba(168,85,247,.6));
      animation:tpulse 3s ease-in-out infinite;
    }
    @keyframes tpulse {
      0%,100%{filter:drop-shadow(0 0 28px rgba(168,85,247,.6));}
      50%     {filter:drop-shadow(0 0 48px rgba(0,212,255,.85));}
    }
    .lobby-sub { font-size:13px; letter-spacing:4px; text-transform:uppercase; color:var(--dim); margin-bottom:24px; }
    .pick-label { font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--dim); margin-bottom:9px; }
    .ball-row { display:flex; gap:7px; margin-bottom:24px; }
    .ball-btn {
      width:42px; height:42px; border-radius:50%;
      border:2px solid rgba(255,255,255,.18); background:rgba(255,255,255,.05);
      color:var(--text); font-size:15px; font-weight:700; cursor:pointer; transition:all .18s;
      display:flex; align-items:center; justify-content:center;
    }
    .ball-btn:hover { border-color:var(--a2); background:rgba(0,212,255,.1); transform:scale(1.1); }
    .ball-btn.sel  { border-color:var(--a2); background:rgba(0,212,255,.22); box-shadow:0 0 14px rgba(0,212,255,.45); transform:scale(1.13); }
    .lvl-cards { display:flex; gap:11px; margin-bottom:24px; width:100%; }
    .lvc {
      flex:1; padding:14px 10px 12px; border-radius:15px;
      border:2px solid rgba(255,255,255,.1); background:rgba(255,255,255,.04);
      cursor:pointer; text-align:center; transition:all .22s; position:relative; overflow:hidden;
    }
    .lvc::before { content:''; position:absolute; inset:0; opacity:0; transition:opacity .3s; border-radius:13px; }
    .lvc:hover::before { opacity:1; }
    .lvc-q  { border-color:rgba(0,212,255,.25); }
    .lvc-s  { border-color:rgba(168,85,247,.25); }
    .lvc-m  { border-color:rgba(255,45,120,.25); }
    .lvc-q::before  { background:linear-gradient(135deg,rgba(0,212,255,.12),transparent); }
    .lvc-s::before  { background:linear-gradient(135deg,rgba(168,85,247,.12),transparent); }
    .lvc-m::before  { background:linear-gradient(135deg,rgba(255,45,120,.12),transparent); }
    .lvc.sel { transform:translateY(-4px); }
    .lvc-q.sel  { border-color:var(--a2); box-shadow:0 8px 28px rgba(0,212,255,.3); }
    .lvc-s.sel  { border-color:var(--a3); box-shadow:0 8px 28px rgba(168,85,247,.3); }
    .lvc-m.sel  { border-color:var(--a1); box-shadow:0 8px 28px rgba(255,45,120,.3); }
    .lv-ico  { font-size:26px; margin-bottom:5px; }
    .lv-name { font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,.8); margin-bottom:3px; }
    .lv-q .lv-t  { color:var(--a2); }
    .lv-s .lv-t  { color:var(--a3); }
    .lv-m .lv-t  { color:var(--a1); }
    .lv-t   { font-size:21px; font-weight:900; }
    .lv-dsc { font-size:10px; color:var(--dim); margin-top:3px; letter-spacing:1px; }
    .start-btn {
      width:100%; padding:15px; border-radius:50px; border:none;
      background:linear-gradient(135deg,var(--a1),var(--a3));
      color:#fff; font-size:15px; font-weight:800; letter-spacing:3px; text-transform:uppercase;
      cursor:pointer; transition:all .2s;
      box-shadow:0 4px 22px rgba(255,45,120,.4);
    }
    .start-btn:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(255,45,120,.5); }

    /* ── CAMERA ── */
    #s-camera { gap:14px; }
    .cam-ttl  { font-size:19px; font-weight:700; }
    .cam-prog { font-size:12px; color:var(--dim); letter-spacing:2px; text-transform:uppercase; }
    .cam-wrap { position:relative; width:210px; height:210px; }
    #cam-video { width:210px; height:210px; border-radius:50%; object-fit:cover; border:3px solid rgba(255,255,255,.2); }
    .cam-ov {
      position:absolute; inset:0; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-size:70px; font-weight:900; color:#fff;
      text-shadow:0 0 28px rgba(255,255,255,.8); pointer-events:none;
    }
    .cam-faces { display:flex; gap:9px; flex-wrap:wrap; justify-content:center; max-width:340px; }
    .face-slot {
      width:50px; height:50px; border-radius:50%;
      border:2px solid rgba(255,255,255,.2); object-fit:cover;
      transition:border-color .2s, box-shadow .2s;
    }
    .face-slot.done    { border-color:#22c55e; }
    .face-slot.current { border-color:var(--a2); box-shadow:0 0 11px rgba(0,212,255,.5); }
    .snap-btn {
      padding:11px 34px; border-radius:50px; border:2px solid var(--a2);
      background:rgba(0,212,255,.1); color:var(--a2);
      font-size:13px; font-weight:700; letter-spacing:2px; cursor:pointer; transition:all .18s;
    }
    .snap-btn:hover  { background:rgba(0,212,255,.22); transform:scale(1.04); }
    .snap-btn:disabled { opacity:.4; cursor:not-allowed; }

    /* ── GAME ── */
    #s-game { padding:0; }
    #game-canvas { display:block; border-radius:10px; box-shadow:0 0 50px rgba(0,0,0,.7); }
    .hud {
      position:fixed; top:10px; left:50%; transform:translateX(-50%);
      display:flex; align-items:center; gap:14px; z-index:20;
      background:rgba(7,7,26,.82); border:1px solid rgba(255,255,255,.11);
      border-radius:50px; padding:7px 18px; backdrop-filter:blur(10px);
    }
    .hud-level { font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--dim); }
    .hud-timer { font-size:21px; font-weight:900; letter-spacing:2px; color:var(--a2); min-width:52px; text-align:center; }
    .hud-timer.warn { color:var(--a1); animation:twarn .5s ease infinite; }
    @keyframes twarn { 0%,100%{opacity:1;} 50%{opacity:.35;} }
    .hud-balls { font-size:12px; font-weight:700; color:rgba(255,255,255,.65); }

    /* ── RESULTS ── */
    #s-results { gap:14px; overflow:hidden; }
    #confetti-canvas { position:fixed; inset:0; pointer-events:none; z-index:50; }
    .res-title {
      font-size:34px; font-weight:900;
      background:linear-gradient(135deg,var(--a4),var(--a1));
      -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    }
    .res-cards { display:flex; flex-wrap:wrap; justify-content:center; gap:9px; max-width:400px; }
    .res-card {
      display:flex; flex-direction:column; align-items:center; gap:5px;
      padding:13px 16px; border-radius:14px;
      background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.11); min-width:86px;
    }
    .res-face  { width:54px; height:54px; border-radius:50%; object-fit:cover; border:2px solid rgba(255,255,255,.28); }
    .res-score { font-size:21px; font-weight:900; color:var(--a4); }
    .res-lbl   { font-size:10px; color:var(--dim); letter-spacing:1px; }
    .again-btn {
      padding:13px 38px; border-radius:50px;
      border:2px solid var(--a3); background:rgba(168,85,247,.14);
      color:var(--a3); font-size:13px; font-weight:700; letter-spacing:2px;
      cursor:pointer; transition:all .18s; text-transform:uppercase;
    }
    .again-btn:hover { background:rgba(168,85,247,.28); transform:scale(1.04); }

    /* ── FOOTER ── */
    footer {
      position:fixed; bottom:0; left:0; right:0; z-index:100;
      height:34px; display:flex; align-items:center; justify-content:center; gap:10px;
      background:rgba(7,7,26,.9); border-top:1px solid rgba(255,255,255,.06);
      font-size:12px;
    }
    .footer-dev  { color:var(--dim); letter-spacing:1px; }
    .footer-sep  { color:rgba(255,255,255,.2); }
    .footer-cool { color:var(--a2); font-weight:600; }
  </style>
</head>
<body>

  <!-- LOBBY -->
  <div id="s-lobby" class="screen active">
    <canvas id="lobby-canvas"></canvas>
    <div class="lobby-content">
      <h1 class="lobby-title">BALL<br>DROP</h1>
      <p class="lobby-sub">Selfie Physics Chaos</p>
      <p class="pick-label">Choose balls</p>
      <div class="ball-row" id="ball-row"></div>
      <p class="pick-label">Select mode</p>
      <div class="lvl-cards">
        <div class="lvc lvc-q lv-q" data-secs="10" data-name="QUICK">
          <div class="lv-ico">⚡</div>
          <div class="lv-name">Quick</div>
          <div class="lv-t">10s</div>
          <div class="lv-dsc">Lightning fast</div>
        </div>
        <div class="lvc lvc-s lv-s sel" data-secs="30" data-name="STANDARD">
          <div class="lv-ico">🎯</div>
          <div class="lv-name">Standard</div>
          <div class="lv-t">30s</div>
          <div class="lv-dsc">Classic mode</div>
        </div>
        <div class="lvc lvc-m lv-m" data-secs="60" data-name="MARATHON">
          <div class="lv-ico">🔥</div>
          <div class="lv-name">Marathon</div>
          <div class="lv-t">1 min</div>
          <div class="lv-dsc">Ultimate chaos</div>
        </div>
      </div>
      <button class="start-btn" id="start-btn">START GAME</button>
    </div>
  </div>

  <!-- CAMERA -->
  <div id="s-camera" class="screen hidden">
    <p class="cam-ttl" id="cam-ttl">Player 1, get ready!</p>
    <p class="cam-prog" id="cam-prog">Ball 1 of 4</p>
    <div class="cam-wrap">
      <video id="cam-video" autoplay muted playsinline></video>
      <div class="cam-ov" id="cam-ov"></div>
    </div>
    <div class="cam-faces" id="cam-faces"></div>
    <button class="snap-btn" id="snap-btn">TAKE SELFIE</button>
  </div>

  <!-- GAME -->
  <div id="s-game" class="screen hidden">
    <div class="hud" id="hud">
      <span class="hud-level" id="hud-lvl">STANDARD</span>
      <span class="hud-timer" id="hud-timer">0:30</span>
      <span class="hud-balls" id="hud-balls">4 balls</span>
    </div>
    <canvas id="game-canvas"></canvas>
  </div>

  <!-- RESULTS -->
  <div id="s-results" class="screen hidden">
    <canvas id="confetti-canvas"></canvas>
    <h2 class="res-title">RESULTS</h2>
    <div class="res-cards" id="res-cards"></div>
    <button class="again-btn" id="again-btn">PLAY AGAIN</button>
  </div>

  <!-- FOOTER -->
  <footer>
    <span class="footer-dev">Developed by Denys</span>
    <span class="footer-sep">·</span>
    <span class="footer-cool">luke and blair are cool</span>
  </footer>

<script>
// ================================================================
// CONSTANTS
// ================================================================
const CW = 460, CH = 700;
const WORLD_W = 460, WORLD_H = 4400;
const WALL_L = 40, WALL_R = 420;
const GRAVITY = 520;
const BALL_R  = 19;
const REST     = 0.58;
const BUMP_REST = 1.05;
const FRICTION  = 0.987;
const SLOT_N    = 7;
const SLOT_MX   = [1, 3, 10, 50, 10, 3, 1];
const SLOT_Y    = WORLD_H - 90;
const FLOOR_Y   = WORLD_H - 8;
const BALL_COLORS = ['#ff2d78','#00d4ff','#a855f7','#fbbf24','#34d399','#f97316','#60a5fa','#e879f9'];
const BUMP_COLORS = ['#00d4ff','#a855f7','#ff2d78','#fbbf24','#34d399','#f97316','#60a5fa','#e879f9'];
const EMOJIS      = ['🐸','🦊','🐼','🐯','🦁','🐻','🐺','🦝'];

// ================================================================
// STATE
// ================================================================
let ballCount = 4, levelSecs = 30, levelName = 'STANDARD';
let faceImages = [], faceIdx = 0, camStream = null;
let balls = [], bumpers = [], ramps = [], slotDivs = [];
let particles = [], confettiParts = [];
let cameraY = 0, targetCamY = 0;
let gameActive = false, gameStartTime = 0, timerEnd = 0;
let spawnQueue = [], spawnIdx = 0;
let raf = null, confettiRaf = null, lastT = 0;

// ================================================================
// LOBBY CANVAS – animated stars + orbs
// ================================================================
;(function() {
  const c = document.getElementById('lobby-canvas');
  const ctx = c.getContext('2d');
  let W, H, stars = [], t = 0;
  const orbs = [
    { px:.15, py:.3, r:90, col:'rgba(168,85,247,', spd:.00015 },
    { px:.85, py:.7, r:70, col:'rgba(0,212,255,', spd:.0002 },
    { px:.5,  py:.1, r:55, col:'rgba(255,45,120,', spd:.00018 },
  ];
  function resize() {
    W = c.width = window.innerWidth;
    H = c.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);
  for (let i = 0; i < 130; i++) {
    stars.push({ x:Math.random(), y:Math.random(), r:Math.random()*1.4+.3,
      tw:Math.random()*Math.PI*2, spd:Math.random()*.022+.008, op:Math.random()*.7+.3 });
  }
  (function frame() {
    requestAnimationFrame(frame);
    t += .016;
    ctx.clearRect(0,0,W,H);
    orbs.forEach((o,i) => {
      const ox = (o.px + Math.sin(t*o.spd*1000+i)*.05)*W;
      const oy = (o.py + Math.cos(t*o.spd*800+i)*.04)*H;
      const g = ctx.createRadialGradient(ox,oy,0,ox,oy,o.r*2.2);
      g.addColorStop(0, o.col+'0.13)');
      g.addColorStop(1, o.col+'0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(ox,oy,o.r*2.2,0,Math.PI*2); ctx.fill();
    });
    stars.forEach(s => {
      s.tw += s.spd;
      const op = s.op*(0.55+0.45*Math.sin(s.tw));
      ctx.fillStyle = `rgba(255,255,255,${op})`;
      ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2); ctx.fill();
    });
  })();
})();

// ================================================================
// LOBBY SETUP
// ================================================================
const ballRow = document.getElementById('ball-row');
for (let i = 1; i <= 8; i++) {
  const b = document.createElement('button');
  b.className = 'ball-btn' + (i===4?' sel':'');
  b.textContent = i;
  b.addEventListener('click', () => {
    ballCount = i;
    ballRow.querySelectorAll('.ball-btn').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
  });
  ballRow.appendChild(b);
}

document.querySelectorAll('.lvc').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('.lvc').forEach(c=>c.classList.remove('sel'));
    card.classList.add('sel');
    levelSecs = parseInt(card.dataset.secs);
    levelName  = card.dataset.name;
  });
});

document.getElementById('start-btn').addEventListener('click', () => {
  showScreen('s-camera');
  initCamera();
});

document.getElementById('again-btn').addEventListener('click', () => {
  faceImages=[]; faceIdx=0;
  if(confettiRaf){cancelAnimationFrame(confettiRaf);confettiRaf=null;}
  showScreen('s-lobby');
});

// ================================================================
// SCREEN TRANSITIONS
// ================================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.remove('active'); s.classList.add('hidden');
  });
  const s = document.getElementById(id);
  s.classList.remove('hidden');
  requestAnimationFrame(()=>s.classList.add('active'));
}

// ================================================================
// CAMERA / SELFIE
// ================================================================
const camTtl    = document.getElementById('cam-ttl');
const camProg   = document.getElementById('cam-prog');
const camVideo  = document.getElementById('cam-video');
const camOv     = document.getElementById('cam-ov');
const camFaces  = document.getElementById('cam-faces');
const snapBtn   = document.getElementById('snap-btn');

async function initCamera() {
  faceImages=[]; faceIdx=0; camFaces.innerHTML='';
  for (let i=0;i<ballCount;i++) {
    const img = document.createElement('img');
    img.className='face-slot'+(i===0?' current':'');
    img.id=`fp-${i}`;
    img.src='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50"><circle cx="25" cy="25" r="25" fill="%23111"/></svg>';
    camFaces.appendChild(img);
  }
  updateCamUI();
  try {
    camStream = await navigator.mediaDevices.getUserMedia({video:true});
    camVideo.srcObject = camStream;
  } catch(e) {
    autoFillEmojis();
  }
}

function autoFillEmojis() {
  for (let i=0;i<ballCount;i++) {
    faceImages.push(makeEmojiDataURL(EMOJIS[i%EMOJIS.length]));
    const el=document.getElementById(`fp-${i}`);
    if(el){el.src=faceImages[i];el.classList.add('done');el.classList.remove('current');}
  }
  setTimeout(startGame,500);
}

function makeEmojiDataURL(emoji) {
  const c=document.createElement('canvas'); c.width=c.height=128;
  const x=c.getContext('2d');
  x.fillStyle='#1a1a2e';
  x.beginPath();x.arc(64,64,64,0,Math.PI*2);x.fill();
  x.font='70px serif'; x.textAlign='center'; x.textBaseline='middle';
  x.fillText(emoji,64,68);
  return c.toDataURL();
}

function updateCamUI() {
  camTtl.textContent  = `Player ${faceIdx+1}, get ready!`;
  camProg.textContent = `Ball ${faceIdx+1} of ${ballCount}`;
}

let cdInterval=null;
snapBtn.addEventListener('click',()=>{
  if(cdInterval)return;
  snapBtn.disabled=true;
  let n=3;
  camOv.textContent=n;
  cdInterval=setInterval(()=>{
    n--;
    if(n>0){camOv.textContent=n;}
    else{
      clearInterval(cdInterval);cdInterval=null;
      camOv.textContent='';
      captureSnap();
      snapBtn.disabled=false;
    }
  },900);
});

function captureSnap() {
  const c=document.createElement('canvas'); c.width=c.height=210;
  const x=c.getContext('2d');
  x.save(); x.translate(210,0); x.scale(-1,1);
  x.drawImage(camVideo,0,0,210,210);
  x.restore();
  const url=c.toDataURL('image/jpeg',.8);
  faceImages.push(url);
  const el=document.getElementById(`fp-${faceIdx}`);
  if(el){el.src=url;el.classList.add('done');el.classList.remove('current');}
  faceIdx++;
  if(faceIdx<ballCount){
    const nx=document.getElementById(`fp-${faceIdx}`);
    if(nx)nx.classList.add('current');
    updateCamUI();
  } else {
    if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}
    setTimeout(startGame,350);
  }
}

// ================================================================
// BUILD OBSTACLES
// ================================================================
function buildObstacles() {
  bumpers=[]; ramps=[];

  // ── BUMPERS (circular pegs) ──
  // Each row: { y, xs:[], r }
  const rows = [
    {y:440,  xs:[130,230,330],        r:24},
    {y:560,  xs:[80,180,280,380],     r:22},
    {y:680,  xs:[130,230,330],        r:24},
    {y:820,  xs:[90,200,310,390],     r:22},
    {y:960,  xs:[140,245,350],        r:26},
    {y:1090, xs:[80,175,270,365,410], r:20},
    {y:1230, xs:[115,215,315],        r:26},
    {y:1370, xs:[75,170,265,360,415], r:20},
    {y:1510, xs:[130,230,330],        r:24},
    {y:1650, xs:[85,180,275,370],     r:22},
    {y:1800, xs:[130,230,330],        r:26},
    {y:1950, xs:[80,175,280,385],     r:22},
    {y:2100, xs:[120,230,340],        r:24},
    {y:2250, xs:[75,170,270,370,415], r:20},
    {y:2400, xs:[120,230,340],        r:24},
    {y:2550, xs:[80,178,276,374],     r:22},
    {y:2700, xs:[130,235,340],        r:26},
    {y:2850, xs:[80,175,270,365],     r:22},
    {y:3000, xs:[120,230,340],        r:24},
    {y:3150, xs:[80,175,270,365,415], r:20},
    {y:3300, xs:[130,230,330],        r:24},
    {y:3450, xs:[85,180,275,370],     r:22},
    {y:3600, xs:[130,235,340],        r:24},
    {y:3750, xs:[80,175,270,370],     r:22},
    {y:3880, xs:[130,230,330],        r:22},
  ];

  let ci=0;
  rows.forEach(row=>{
    row.xs.forEach(x=>{
      bumpers.push({x, y:row.y, r:row.r,
        color:BUMP_COLORS[ci%BUMP_COLORS.length],
        hitTime:0});
      ci++;
    });
  });

  // ── RAMPS (diagonal platforms) ──
  // Pairs of angled platforms funneling balls through the world
  const rampDefs = [
    // y ~750: V-shape funnel opening
    {ax:WALL_L, ay:760, bx:190, by:810, color:'#00d4ff'},
    {ax:270,    ay:810, bx:WALL_R, by:760, color:'#a855f7'},
    // y ~1150
    {ax:WALL_L, ay:1160, bx:200, by:1200, color:'#ff2d78'},
    {ax:260,    ay:1200, bx:WALL_R, by:1160, color:'#fbbf24'},
    // y ~1560
    {ax:160,    ay:1560, bx:WALL_R-10, by:1520, color:'#34d399'},
    {ax:WALL_L, ay:1520, bx:180, by:1560, color:'#f97316'},
    // y ~1970
    {ax:WALL_L, ay:1970, bx:195, by:2010, color:'#60a5fa'},
    {ax:265,    ay:2010, bx:WALL_R, by:1970, color:'#e879f9'},
    // y ~2380
    {ax:155,    ay:2380, bx:WALL_R-10, by:2340, color:'#00d4ff'},
    {ax:WALL_L, ay:2340, bx:175, by:2380, color:'#a855f7'},
    // y ~2780
    {ax:WALL_L, ay:2780, bx:200, by:2820, color:'#ff2d78'},
    {ax:260,    ay:2820, bx:WALL_R, by:2780, color:'#fbbf24'},
    // y ~3180
    {ax:160,    ay:3180, bx:WALL_R-10, by:3140, color:'#34d399'},
    {ax:WALL_L, ay:3140, bx:180, by:3180, color:'#f97316'},
    // y ~3600
    {ax:WALL_L, ay:3610, bx:200, by:3650, color:'#60a5fa'},
    {ax:260,    ay:3650, bx:WALL_R, by:3610, color:'#e879f9'},
  ];
  ramps = rampDefs;

  // Slot dividers
  slotDivs=[];
  const sw=(WALL_R-WALL_L)/SLOT_N;
  for(let i=1;i<SLOT_N;i++) slotDivs.push(WALL_L+i*sw);
}

// ================================================================
// BALL FACTORY
// ================================================================
function makeBall(idx, faceImg) {
  return {
    x: WALL_L+18 + Math.random()*(WALL_R-WALL_L-36),
    y: 60, vx:(Math.random()-.5)*100, vy:0,
    r:BALL_R,
    color:BALL_COLORS[idx%BALL_COLORS.length],
    faceImg, rotation:0, angVel:(Math.random()-.5)*4,
    settled:false, slot:-1, score:0, idx,
    trail:[], lastTrail:0
  };
}

// ================================================================
// START GAME
// ================================================================
function startGame() {
  showScreen('s-game');
  const canvas=document.getElementById('game-canvas');
  canvas.width=CW; canvas.height=CH;

  buildObstacles();
  balls=[]; particles=[]; cameraY=0; targetCamY=0;

  const loadedFaces = faceImages.map(src=>{
    const img=new Image(); img.src=src; return img;
  });

  // Stagger spawns: spread across first 40% of level time
  const spawnSpread = Math.max(levelSecs*400, 1200);
  spawnQueue=[];
  for(let i=0;i<ballCount;i++){
    spawnQueue.push({idx:i, t:i*(spawnSpread/ballCount), face:loadedFaces[i]});
  }
  spawnIdx=0;

  gameStartTime=performance.now();
  timerEnd=gameStartTime+levelSecs*1000;
  gameActive=true;

  document.getElementById('hud-lvl').textContent=levelName;
  document.getElementById('hud-balls').textContent=`${ballCount} ball${ballCount>1?'s':''}`;
  setTimerDisplay(levelSecs);

  if(raf)cancelAnimationFrame(raf);
  lastT=performance.now();
  raf=requestAnimationFrame(loop);
}

function setTimerDisplay(s) {
  const el=document.getElementById('hud-timer');
  const sec=Math.ceil(Math.max(0,s));
  const m=Math.floor(sec/60), r=sec%60;
  el.textContent=m>0?`${m}:${r.toString().padStart(2,'0')}`:
    `0:${r.toString().padStart(2,'0')}`;
  el.classList.toggle('warn', s<=5 && s>0);
}

// ================================================================
// GAME LOOP
// ================================================================
function loop(now) {
  raf=requestAnimationFrame(loop);
  const dt=Math.min((now-lastT)/1000,.05);
  lastT=now;
  if(!gameActive)return;

  const elapsed=now-gameStartTime;
  const secsLeft=Math.max(0,(timerEnd-now)/1000);
  setTimerDisplay(secsLeft);

  // Spawn queued balls
  while(spawnIdx<spawnQueue.length && elapsed>=spawnQueue[spawnIdx].t){
    balls.push(makeBall(spawnQueue[spawnIdx].idx, spawnQueue[spawnIdx].face));
    spawnIdx++;
  }

  physics(dt);
  updateCam();
  updateParticles(dt);

  // End condition: timer done AND all balls settled (with up to 8s grace)
  const allSpawned=spawnIdx>=spawnQueue.length;
  const allSettled=balls.length>0 && balls.every(b=>b.settled);
  const graceOver=(now-timerEnd)>8000;

  if(allSpawned && (allSettled || (secsLeft<=0 && graceOver))){
    gameActive=false;
    cancelAnimationFrame(raf);
    if(!allSettled) balls.forEach(b=>{if(!b.settled)settleBall(b);});
    setTimeout(showResults,700);
  }

  render(now);
}

// ================================================================
// PHYSICS
// ================================================================
function physics(dt) {
  for(const b of balls){
    if(b.settled)continue;
    b.vy+=GRAVITY*dt;
    b.x+=b.vx*dt;
    b.y+=b.vy*dt;
    b.rotation+=b.angVel*dt;
    b.angVel*=.99;

    // Trail
    const pnow=performance.now();
    if(pnow-b.lastTrail>35){
      b.trail.push({x:b.x,y:b.y});
      if(b.trail.length>9)b.trail.shift();
      b.lastTrail=pnow;
    }

    // Walls
    if(b.x-b.r<WALL_L){b.x=WALL_L+b.r;b.vx=Math.abs(b.vx)*REST;b.angVel=b.vy*.02;}
    if(b.x+b.r>WALL_R){b.x=WALL_R-b.r;b.vx=-Math.abs(b.vx)*REST;b.angVel=-b.vy*.02;}

    // Floor
    if(b.y+b.r>FLOOR_Y){
      b.y=FLOOR_Y-b.r; b.vy*=-REST; b.vx*=FRICTION;
      if(Math.abs(b.vy)<25&&Math.abs(b.vx)<25)settleBall(b);
    }

    // Settle zone
    if(b.y+b.r>SLOT_Y&&!b.settled)settleBall(b);

    // Bumpers
    for(const bump of bumpers)hitBumper(b,bump);
    // Ramps
    for(const ramp of ramps)hitRamp(b,ramp);

    b.vx*=FRICTION;
  }

  // Ball–ball
  for(let i=0;i<balls.length;i++){
    for(let j=i+1;j<balls.length;j++) ballBall(balls[i],balls[j]);
  }

  // Slot dividers (bottom region)
  for(const b of balls){
    if(b.settled||b.y+b.r<SLOT_Y-60)continue;
    for(const dx of slotDivs){
      if(Math.abs(b.x-dx)<b.r+3){
        if(b.x<dx){b.x=dx-b.r-3;b.vx=-Math.abs(b.vx)*REST;}
        else      {b.x=dx+b.r+3;b.vx= Math.abs(b.vx)*REST;}
      }
    }
  }
}

function settleBall(b) {
  const sw=(WALL_R-WALL_L)/SLOT_N;
  const s=Math.max(0,Math.min(SLOT_N-1,Math.floor((b.x-WALL_L)/sw)));
  b.slot=s; b.score=SLOT_MX[s]; b.settled=true;
  b.vx=0; b.vy=0;
  b.x=WALL_L+(s+.5)*sw;
  b.y=SLOT_Y+22;
  burst(b.x,b.y,b.color,12);
}

// ================================================================
// COLLISIONS
// ================================================================
function hitBumper(b,bump){
  const dx=b.x-bump.x, dy=b.y-bump.y;
  const d2=dx*dx+dy*dy, mn=b.r+bump.r;
  if(d2<mn*mn&&d2>0){
    const d=Math.sqrt(d2), nx=dx/d, ny=dy/d;
    b.x+=nx*(mn-d); b.y+=ny*(mn-d);
    const dot=b.vx*nx+b.vy*ny;
    if(dot<0){
      b.vx-=(1+BUMP_REST)*dot*nx;
      b.vy-=(1+BUMP_REST)*dot*ny;
      b.angVel=(b.vx-b.vy)*.025;
      bump.hitTime=performance.now();
      burst(bump.x,bump.y,bump.color,5);
    }
  }
}

function closestPt(px,py,ax,ay,bx,by){
  const abx=bx-ax,aby=by-ay,len2=abx*abx+aby*aby;
  if(len2===0)return{x:ax,y:ay};
  const t=Math.max(0,Math.min(1,((px-ax)*abx+(py-ay)*aby)/len2));
  return{x:ax+t*abx,y:ay+t*aby};
}

function hitRamp(b,ramp){
  const cp=closestPt(b.x,b.y,ramp.ax,ramp.ay,ramp.bx,ramp.by);
  const dx=b.x-cp.x, dy=b.y-cp.y, d2=dx*dx+dy*dy;
  if(d2<b.r*b.r&&d2>0){
    const d=Math.sqrt(d2), nx=dx/d, ny=dy/d;
    b.x+=nx*(b.r-d); b.y+=ny*(b.r-d);
    const dot=b.vx*nx+b.vy*ny;
    if(dot<0){
      b.vx-=(1+REST)*dot*nx;
      b.vy-=(1+REST)*dot*ny;
      b.vx*=FRICTION; b.vy*=FRICTION;
      b.angVel=b.vx*.025;
    }
  }
}

function ballBall(a,b){
  if(a.settled&&b.settled)return;
  const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy,mn=a.r+b.r;
  if(d2<mn*mn&&d2>0){
    const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ov=(mn-d)*.5;
    if(!a.settled){a.x-=nx*ov;a.y-=ny*ov;}
    if(!b.settled){b.x+=nx*ov;b.y+=ny*ov;}
    const dvx=a.vx-b.vx,dvy=a.vy-b.vy,dot=dvx*nx+dvy*ny;
    if(dot>0){
      const imp=dot*REST;
      if(!a.settled){a.vx-=imp*nx;a.vy-=imp*ny;}
      if(!b.settled){b.vx+=imp*nx;b.vy+=imp*ny;}
    }
  }
}

// ================================================================
// CAMERA FOLLOW
// ================================================================
function updateCam(){
  if(!balls.length)return;
  let lowY=0, anyActive=false;
  for(const b of balls){
    if(!b.settled){lowY=Math.max(lowY,b.y);anyActive=true;}
  }
  if(!anyActive)lowY=WORLD_H;
  targetCamY=Math.max(0,Math.min(lowY-CH*.65,WORLD_H-CH));
  cameraY+=(targetCamY-cameraY)*.1;
}

// ================================================================
// PARTICLES
// ================================================================
function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=(Math.PI*2*i)/n+Math.random()*.5;
    const spd=70+Math.random()*110;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-45,
      r:2.5+Math.random()*3,color,life:1,decay:.028+Math.random()*.028});
  }
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=180*dt; p.life-=p.decay;
    if(p.life<=0)particles.splice(i,1);
  }
}

// ================================================================
// RENDER
// ================================================================
function render(now){
  const canvas=document.getElementById('game-canvas');
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,CW,CH);

  // BG
  ctx.fillStyle='#07071a'; ctx.fillRect(0,0,CW,CH);
  const bg=ctx.createLinearGradient(0,0,0,CH);
  bg.addColorStop(0,'rgba(168,85,247,.04)');
  bg.addColorStop(.5,'rgba(0,212,255,.02)');
  bg.addColorStop(1,'rgba(255,45,120,.04)');
  ctx.fillStyle=bg; ctx.fillRect(0,0,CW,CH);

  ctx.save();
  ctx.translate(0,-Math.round(cameraY));

  drawWalls(ctx);
  drawRamps(ctx,now);
  drawBumpers(ctx,now);
  drawParticles(ctx);
  drawBalls(ctx);
  drawSlots(ctx);

  ctx.restore();

  drawScrollbar(ctx);
}

function drawWalls(ctx){
  ctx.fillStyle='rgba(255,255,255,.07)';
  ctx.fillRect(0,0,WALL_L,WORLD_H);
  ctx.fillRect(WALL_R,0,WORLD_W-WALL_R,WORLD_H);

  const lw=ctx.createLinearGradient(0,0,WALL_L,0);
  lw.addColorStop(0,'rgba(0,212,255,0)');
  lw.addColorStop(1,'rgba(0,212,255,.14)');
  ctx.fillStyle=lw; ctx.fillRect(0,0,WALL_L,WORLD_H);

  const rw=ctx.createLinearGradient(WALL_R,0,WORLD_W,0);
  rw.addColorStop(0,'rgba(168,85,247,.14)');
  rw.addColorStop(1,'rgba(168,85,247,0)');
  ctx.fillStyle=rw; ctx.fillRect(WALL_R,0,WORLD_W-WALL_R,WORLD_H);
}

function drawBumpers(ctx,now){
  for(const b of bumpers){
    const age=(now-b.hitTime)/1000;
    const flash=Math.max(0,1-age*3);

    // Outer glow
    const gr=b.r+7+flash*12;
    const g=ctx.createRadialGradient(b.x,b.y,b.r*.3,b.x,b.y,gr);
    g.addColorStop(0,b.color+'bb');
    g.addColorStop(.5,b.color+'33');
    g.addColorStop(1,b.color+'00');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(b.x,b.y,gr,0,Math.PI*2);ctx.fill();

    // Body
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    const bg=ctx.createRadialGradient(b.x-b.r*.3,b.y-b.r*.3,0,b.x,b.y,b.r);
    bg.addColorStop(0,'#fff');
    bg.addColorStop(.3,b.color);
    bg.addColorStop(1,shade(b.color,-40));
    ctx.fillStyle=bg; ctx.fill();

    if(flash>0){
      ctx.fillStyle=`rgba(255,255,255,${flash*.55})`;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    }
    ctx.strokeStyle=`rgba(255,255,255,${.28+flash*.5})`;
    ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();
  }
}

function drawRamps(ctx){
  for(const r of ramps){
    ctx.save(); ctx.lineCap='round';
    ctx.strokeStyle=r.color+'3a'; ctx.lineWidth=18;
    ctx.beginPath();ctx.moveTo(r.ax,r.ay);ctx.lineTo(r.bx,r.by);ctx.stroke();
    ctx.strokeStyle=r.color; ctx.lineWidth=7;
    ctx.beginPath();ctx.moveTo(r.ax,r.ay);ctx.lineTo(r.bx,r.by);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.38)'; ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(r.ax,r.ay);ctx.lineTo(r.bx,r.by);ctx.stroke();
    ctx.restore();
  }
}

function drawParticles(ctx){
  for(const p of particles){
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawBalls(ctx){
  for(const b of balls){
    // Trail
    for(let i=1;i<b.trail.length;i++){
      const a=b.trail[i-1],c=b.trail[i];
      const al=(i/b.trail.length)*.28;
      const hex=Math.floor(al*255).toString(16).padStart(2,'0');
      ctx.strokeStyle=b.color+hex;
      ctx.lineWidth=b.r*.55*(i/b.trail.length);
      ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(c.x,c.y);ctx.stroke();
    }

    ctx.save();
    ctx.translate(b.x,b.y);
    ctx.rotate(b.rotation);

    // Outer glow
    const og=ctx.createRadialGradient(0,0,b.r,0,0,b.r*2.1);
    og.addColorStop(0,b.color+'3a');
    og.addColorStop(1,b.color+'00');
    ctx.fillStyle=og;
    ctx.beginPath();ctx.arc(0,0,b.r*2.1,0,Math.PI*2);ctx.fill();

    // Face clip
    ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.clip();
    if(b.faceImg&&b.faceImg.complete&&b.faceImg.naturalWidth>0){
      ctx.drawImage(b.faceImg,-b.r,-b.r,b.r*2,b.r*2);
    } else {
      const fg=ctx.createRadialGradient(-b.r*.3,-b.r*.3,0,0,0,b.r);
      fg.addColorStop(0,'#fff');fg.addColorStop(.35,b.color);fg.addColorStop(1,shade(b.color,-50));
      ctx.fillStyle=fg;ctx.fillRect(-b.r,-b.r,b.r*2,b.r*2);
    }
    ctx.restore();

    // Ring
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.strokeStyle=b.settled?'#22c55e':'rgba(255,255,255,.6)';
    ctx.lineWidth=b.settled?3:2;
    ctx.stroke();
  }
}

function drawSlots(ctx){
  const sw=(WALL_R-WALL_L)/SLOT_N;
  for(let i=0;i<SLOT_N;i++){
    const sx=WALL_L+i*sw, mx=SLOT_MX[i], hi=mx>=10;
    const sg=ctx.createLinearGradient(sx,SLOT_Y,sx,WORLD_H);
    sg.addColorStop(0,hi?'rgba(251,191,36,.14)':'rgba(255,255,255,.04)');
    sg.addColorStop(1,hi?'rgba(251,191,36,.04)':'rgba(0,0,0,.1)');
    ctx.fillStyle=sg;
    ctx.fillRect(sx,SLOT_Y,sw,WORLD_H-SLOT_Y);
    ctx.fillStyle=hi?'#fbbf24':'rgba(255,255,255,.45)';
    ctx.font=`bold ${hi?17:13}px Segoe UI`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(`${mx}x`,sx+sw/2,SLOT_Y+28);
  }
  for(const dx of slotDivs){
    ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(dx,SLOT_Y);ctx.lineTo(dx,WORLD_H);ctx.stroke();
  }
  ctx.fillStyle='rgba(255,255,255,.09)';
  ctx.fillRect(WALL_L,FLOOR_Y,WALL_R-WALL_L,4);
}

function drawScrollbar(ctx){
  const pct=cameraY/(WORLD_H-CH);
  const ih=CH-80;
  ctx.fillStyle='rgba(255,255,255,.04)';ctx.fillRect(CW-5,40,3,ih);
  ctx.fillStyle='rgba(0,212,255,.55)';ctx.fillRect(CW-5,40+pct*ih-14,3,14);
}

// ================================================================
// RESULTS
// ================================================================
function showResults(){
  showScreen('s-results');
  const con=document.getElementById('res-cards');
  con.innerHTML='';
  [...balls].sort((a,b)=>b.score-a.score).forEach(b=>{
    const card=document.createElement('div');
    card.className='res-card';
    card.innerHTML=`<img class="res-face" src="${faceImages[b.idx]}"/>
      <div class="res-score">${b.score}x</div>
      <div class="res-lbl">Slot ${b.slot+1}</div>`;
    con.appendChild(card);
  });
  launchConfetti();
}

// ================================================================
// CONFETTI
// ================================================================
function launchConfetti(){
  const canvas=document.getElementById('confetti-canvas');
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  const ctx=canvas.getContext('2d');
  const colors=['#ff2d78','#00d4ff','#a855f7','#fbbf24','#34d399','#f97316'];
  confettiParts=[];
  for(let i=0;i<170;i++){
    confettiParts.push({
      x:Math.random()*canvas.width, y:-20-Math.random()*180,
      w:7+Math.random()*9, h:4+Math.random()*6,
      color:colors[Math.floor(Math.random()*colors.length)],
      vx:(Math.random()-.5)*2.8, vy:2.2+Math.random()*2.8,
      rot:Math.random()*Math.PI*2, rv:(Math.random()-.5)*.18
    });
  }
  if(confettiRaf)cancelAnimationFrame(confettiRaf);
  const end=performance.now()+7000;
  (function frame(){
    if(performance.now()>end){
      cancelAnimationFrame(confettiRaf);
      ctx.clearRect(0,0,canvas.width,canvas.height);
      return;
    }
    confettiRaf=requestAnimationFrame(frame);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(const c of confettiParts){
      c.x+=c.vx;c.y+=c.vy;c.rot+=c.rv;
      ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot);
      ctx.fillStyle=c.color;ctx.globalAlpha=.83;
      ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
      ctx.restore();
      if(c.y>canvas.height+20)c.y=-20;
    }
  })();
}

// ================================================================
// UTILS
// ================================================================
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const r=Math.min(255,Math.max(0,(n>>16)+amt));
  const g=Math.min(255,Math.max(0,((n>>8)&0xff)+amt));
  const b=Math.min(255,Math.max(0,(n&0xff)+amt));
  return`#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}
