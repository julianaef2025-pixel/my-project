<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ball Drop — Selfie Game</title>
  <style>
    /* ============================================================
       RESET & VARIABLES
    ============================================================ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:      #07071a;
      --surface: rgba(255,255,255,0.05);
      --border:  rgba(255,255,255,0.12);
      --a1:      #ff2d78;
      --a2:      #00d4ff;
      --a3:      #a855f7;
      --text:    #f0f0ff;
      --dim:     rgba(240,240,255,0.48);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 34px; /* room for footer */
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 15% 20%, rgba(168,85,247,.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 85% 80%, rgba(0,212,255,.12) 0%, transparent 60%),
        radial-gradient(ellipse 70% 60% at 50% 50%, rgba(255,45,120,.06) 0%, transparent 70%);
    }

    /* ============================================================
       SCREEN SYSTEM
    ============================================================ */
    .screen {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 1;
      transition: opacity .35s ease, transform .35s ease;
    }

    .screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(.97);
    }

    /* ============================================================
       SHARED COMPONENTS
    ============================================================ */
    .panel {
      background: var(--surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 0 60px rgba(168,85,247,.2), 0 0 120px rgba(0,212,255,.08);
    }

    .btn-primary {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 15px 20px;
      background: linear-gradient(135deg, var(--a1), var(--a3));
      border: none; border-radius: 14px;
      color: #fff; font-size: 1.02rem; font-weight: 700;
      cursor: pointer; letter-spacing: .4px;
      transition: transform .18s, box-shadow .18s;
    }
    .btn-primary:hover  { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(255,45,120,.45); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: .38; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-ghost {
      padding: 14px 20px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      color: var(--text); font-size: .94rem; font-weight: 600;
      cursor: pointer; transition: border-color .18s, background .18s;
    }
    .btn-ghost:hover { border-color: var(--a3); background: rgba(168,85,247,.12); }

    .micro-label {
      font-size: .72rem; font-weight: 700; color: var(--dim);
      text-transform: uppercase; letter-spacing: 1.6px;
    }

    /* ============================================================
       SETUP SCREEN
    ============================================================ */
    #setupScreen .panel {
      width: 460px;
      padding: 48px 44px;
      text-align: center;
    }

    .game-logo {
      font-size: 2.9rem; font-weight: 900; letter-spacing: -1px;
      background: linear-gradient(135deg, var(--a1) 0%, var(--a3) 50%, var(--a2) 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .game-tagline {
      color: var(--dim); font-size: .9rem; line-height: 1.55;
      margin-bottom: 38px;
    }

    .count-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
      margin-bottom: 36px;
    }

    .count-btn {
      aspect-ratio: 1;
      border: 1.5px solid var(--border);
      background: transparent;
      border-radius: 14px;
      color: var(--text); font-size: 1.35rem; font-weight: 700;
      cursor: pointer;
      transition: border-color .18s, background .18s, transform .18s, box-shadow .18s;
    }
    .count-btn:hover  { border-color: var(--a3); background: rgba(168,85,247,.14); transform: translateY(-2px); }
    .count-btn.active {
      border-color: var(--a1);
      background: rgba(255,45,120,.22);
      box-shadow: 0 0 18px rgba(255,45,120,.45);
      color: #fff;
    }

    /* ============================================================
       CAMERA SCREEN
    ============================================================ */
    #cameraScreen .panel {
      width: 500px;
      padding: 38px 40px;
      text-align: center;
    }

    .cam-title {
      font-size: 1.55rem; font-weight: 800;
      background: linear-gradient(135deg, var(--a2), var(--a3));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .cam-sub { color: var(--dim); font-size: .88rem; margin-bottom: 18px; }

    .progress-row {
      display: flex; gap: 7px; justify-content: center;
      margin-bottom: 22px;
    }
    .pdot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--border); transition: all .28s;
    }
    .pdot.done   { background: var(--a2); box-shadow: 0 0 8px var(--a2); }
    .pdot.active { background: var(--a1); box-shadow: 0 0 14px var(--a1); transform: scale(1.35); }

    .video-ring {
      position: relative;
      width: 260px; height: 260px;
      margin: 0 auto 20px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--a2);
      box-shadow: 0 0 28px rgba(0,212,255,.35);
    }
    .video-ring video {
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .cam-flash {
      position: absolute; inset: 0;
      background: #fff;
      opacity: 0; pointer-events: none;
      transition: opacity .08s;
    }
    .cam-flash.go { opacity: 1; }

    .countdown-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 5rem; font-weight: 900;
      color: #fff;
      text-shadow: 0 0 30px rgba(255,255,255,.8);
      opacity: 0; pointer-events: none;
      transition: opacity .18s;
    }
    .countdown-overlay.show { opacity: 1; }

    .shutter {
      width: 68px; height: 68px; border-radius: 50%;
      background: linear-gradient(135deg, var(--a1), var(--a3));
      border: 4px solid rgba(255,255,255,.22);
      font-size: 1.7rem;
      cursor: pointer; margin: 0 auto 18px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 28px rgba(255,45,120,.55);
      transition: transform .18s, box-shadow .18s;
    }
    .shutter:hover  { transform: scale(1.1); box-shadow: 0 0 44px rgba(255,45,120,.75); }
    .shutter:active { transform: scale(.92); }
    .shutter:disabled { opacity: .35; cursor: not-allowed; transform: none; }

    .thumbs-row {
      display: flex; gap: 9px; justify-content: center; align-items: center;
      min-height: 60px; flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .thumb, .thumb-ph {
      width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0;
      overflow: hidden;
    }
    .thumb {
      border: 2px solid var(--a2);
      box-shadow: 0 0 10px rgba(0,212,255,.4);
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-ph {
      border: 2px dashed var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--dim); font-size: 1.1rem; font-weight: 700;
    }

    .cam-actions { display: flex; gap: 10px; }
    .cam-actions .btn-primary { flex: 2; }
    .cam-actions .btn-ghost   { flex: 1; }

    .no-cam-note { font-size: .8rem; color: var(--dim); margin-top: 10px; }

    /* ============================================================
       GAME SCREEN
    ============================================================ */
    #gameScreen {
      flex-direction: column;
      gap: 12px;
    }

    .game-hud {
      width: 490px;
      display: flex; align-items: center; gap: 20px;
    }

    .hud-logo {
      font-size: 1.15rem; font-weight: 900;
      background: linear-gradient(135deg, var(--a1), var(--a2));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hud-stat { display: flex; flex-direction: column; align-items: center; }
    .hud-stat-val {
      font-size: 1.7rem; font-weight: 900; line-height: 1;
    }
    .hud-stat-val.cyan   { color: var(--a2); text-shadow: 0 0 16px rgba(0,212,255,.6); }
    .hud-stat-val.violet { color: var(--a3); text-shadow: 0 0 16px rgba(168,85,247,.6); }

    .hud-spacer { flex: 1; }

    #gameCanvas {
      display: block;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 0 50px rgba(168,85,247,.22), 0 0 100px rgba(0,212,255,.1);
    }

    /* ============================================================
       RESULTS SCREEN
    ============================================================ */
    #resultsScreen .panel {
      width: 490px;
      padding: 44px 40px;
      text-align: center;
    }

    .results-title {
      font-size: 2.4rem; font-weight: 900;
      background: linear-gradient(135deg, var(--a2), var(--a1), var(--a3));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .final-score {
      font-size: 3.8rem; font-weight: 900;
      color: var(--a2);
      text-shadow: 0 0 36px rgba(0,212,255,.75);
      margin: 16px 0 24px;
    }

    .breakdown { display: flex; flex-direction: column; gap: 9px; margin-bottom: 28px; }

    .brow {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,.04);
      border-radius: 12px; padding: 11px 15px;
    }

    .brow-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      overflow: hidden; flex-shrink: 0;
      border: 2px solid var(--a2);
    }
    .brow-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .brow-info { flex: 1; text-align: left; }
    .brow-name { font-weight: 700; font-size: .92rem; }
    .brow-slot { font-size: .78rem; color: var(--dim); }
    .brow-pts  { font-weight: 800; font-size: 1.08rem; }

    /* ============================================================
       SCORE POP
    ============================================================ */
    .score-pop {
      position: fixed; pointer-events: none; z-index: 200;
      font-size: 2.1rem; font-weight: 900;
      animation: floatPop 1.3s ease-out forwards;
    }
    @keyframes floatPop {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-90px) scale(1.5); }
    }

    /* ============================================================
       CONFETTI
    ============================================================ */
    .confetti-canvas {
      position: fixed; inset: 0; z-index: 150;
      pointer-events: none;
    }

    /* ============================================================
       FOOTER
    ============================================================ */
    footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 34px;
      display: flex; align-items: center; justify-content: center; gap: 14px;
      background: rgba(5,5,20,.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,.07);
      z-index: 500;
      font-size: .74rem; letter-spacing: .5px;
    }
    .footer-dev  { color: rgba(168,85,247,.75); font-weight: 600; }
    .footer-sep  { color: rgba(255,255,255,.2); }
    .footer-cool { color: rgba(0,212,255,.65); font-weight: 500; }
  </style>
</head>
<body>

  <!-- ══════════════════════════════════════════════════════════
       SETUP SCREEN
  ══════════════════════════════════════════════════════════ -->
  <div id="setupScreen" class="screen">
    <div class="panel">
      <div class="game-logo">BALL DROP</div>
      <p class="game-tagline">Snap a selfie for each ball, then send them<br>crashing through the spike tube!</p>

      <p class="micro-label" style="text-align:left;margin-bottom:14px;">How many balls?</p>
      <div class="count-grid" id="countGrid"></div>

      <button class="btn-primary" id="setupNext" disabled>📸 Take Selfies →</button>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       CAMERA SCREEN
  ══════════════════════════════════════════════════════════ -->
  <div id="cameraScreen" class="screen hidden">
    <div class="panel">
      <div class="cam-title" id="camTitle">Ball 1 of ?</div>
      <div class="cam-sub"  id="camSub">Strike a pose!</div>

      <div class="progress-row" id="progressRow"></div>

      <div class="video-ring">
        <video id="camFeed" autoplay playsinline muted></video>
        <div class="cam-flash" id="camFlash"></div>
        <div class="countdown-overlay" id="countdownOverlay"></div>
      </div>

      <button class="shutter" id="shutterBtn" title="Take photo">📷</button>

      <div class="thumbs-row" id="thumbsRow"></div>

      <div class="cam-actions">
        <button class="btn-ghost"    id="camBack" >← Back</button>
        <button class="btn-primary"  id="camStart" disabled>🚀 Start Game</button>
      </div>

      <p class="no-cam-note" id="noCamNote"></p>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       GAME SCREEN
  ══════════════════════════════════════════════════════════ -->
  <div id="gameScreen" class="screen hidden">
    <div class="game-hud">
      <span class="hud-logo">BALL DROP</span>
      <div class="hud-stat">
        <span class="micro-label">Balls Left</span>
        <span class="hud-stat-val violet" id="hudLeft">—</span>
      </div>
      <div class="hud-stat">
        <span class="micro-label">Active</span>
        <span class="hud-stat-val cyan" id="hudActive">0</span>
      </div>
      <div class="hud-spacer"></div>
      <div class="hud-stat">
        <span class="micro-label">Score</span>
        <span class="hud-stat-val cyan" id="hudScore">0</span>
      </div>
    </div>
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       RESULTS SCREEN
  ══════════════════════════════════════════════════════════ -->
  <div id="resultsScreen" class="screen hidden">
    <canvas class="confetti-canvas" id="confettiCanvas"></canvas>
    <div class="panel">
      <div class="results-title">🎉 Game Over!</div>
      <div class="micro-label">Total Score</div>
      <div class="final-score" id="finalScore">0</div>
      <div class="breakdown" id="breakdown"></div>
      <button class="btn-primary" id="playAgain">🔄 Play Again</button>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       FOOTER
  ══════════════════════════════════════════════════════════ -->
  <footer>
    <span class="footer-dev">Developed by Denys</span>
    <span class="footer-sep">·</span>
    <span class="footer-cool">luke and blair are cool</span>
  </footer>

  <!-- ══════════════════════════════════════════════════════════
       JAVASCRIPT
  ══════════════════════════════════════════════════════════ -->
  <script>
  'use strict';

  /* ============================================================
     CONSTANTS — tube layout, bigger spikes, narrower channel
  ============================================================ */
  const CW       = 490;       // canvas width
  const CH       = 850;       // canvas height
  const GRAVITY  = 1080;      // px / s²
  const BALL_R   = 22;        // ball radius
  const REST     = 0.58;      // restitution (bounciness)
  const FRICTION = 0.988;     // per-frame horizontal damping
  const MAX_LIVE = 4;         // max balls active at once
  const SPAWN_GAP = 700;      // ms between spawns
  const WALL_L   = 52;        // inner left wall x
  const WALL_R   = 438;       // inner right wall x

  /* Slots at the bottom */
  const SLOT_N  = 7;
  const SLOT_MX = [1, 3, 10, 50, 10, 3, 1];
  const SLOT_CL = ['#6b7280','#3b82f6','#a855f7','#ef4444','#a855f7','#3b82f6','#6b7280'];

  const BALL_PALETTE = [
    '#ff2d78','#00d4ff','#a855f7','#fbbf24',
    '#34d399','#f97316','#ec4899','#60a5fa'
  ];
  const FACE_FALLBACK = ['😎','🤩','😜','🥳','😏','🤪','😇','🥸'];

  /* ============================================================
     SPIKE DEFINITIONS
     Each spike is a large triangle from one wall pointing inward.
     'bh' = base half-height (how tall the base on the wall is).
     Tip position forces ball to the opposite gap.
  ============================================================ */
  const SPIKE_DEFS = [
    { side:'left',  cy: 150, tipX: 348, bh: 50, color:'#00d4ff'  },
    { side:'right', cy: 290, tipX: 142, bh: 50, color:'#a855f7'  },
    { side:'left',  cy: 430, tipX: 360, bh: 62, color:'#ff2d78'  },
    { side:'right', cy: 560, tipX: 130, bh: 62, color:'#fbbf24'  },
    { side:'left',  cy: 670, tipX: 345, bh: 44, color:'#34d399'  },
    { side:'right', cy: 755, tipX: 145, bh: 44, color:'#f97316'  },
  ];

  /* ============================================================
     GAME STATE
  ============================================================ */
  const S = {
    screen:    'setup',
    ballCount: 0,
    photos:    [],
    captured:  0,
    stream:    null,
    obstacles: [],
    slots:     [],
    allBalls:  [],
    liveBalls: [],
    queue:     [],
    nextSpawn: 0,
    score:     0,
    results:   [],
    raf:       null,
    lastT:     null,
  };

  /* ============================================================
     DOM REFS
  ============================================================ */
  const SCREENS = {
    setup:   document.getElementById('setupScreen'),
    camera:  document.getElementById('cameraScreen'),
    game:    document.getElementById('gameScreen'),
    results: document.getElementById('resultsScreen'),
  };

  const $         = id => document.getElementById(id);
  const gameCanvas  = $('gameCanvas');
  const ctx         = gameCanvas.getContext('2d');
  const confettiCvs = $('confettiCanvas');
  const confettiCtx = confettiCvs.getContext('2d');

  /* ============================================================
     SCREEN TRANSITIONS
  ============================================================ */
  function showScreen(name) {
    Object.entries(SCREENS).forEach(([k, el]) =>
      el.classList.toggle('hidden', k !== name)
    );
    S.screen = name;
  }

  /* ============================================================
     SETUP SCREEN
  ============================================================ */
  (function initSetup() {
    const grid = $('countGrid');
    for (let i = 1; i <= 8; i++) {
      const b = document.createElement('button');
      b.className = 'count-btn';
      b.textContent = i;
      b.dataset.n = i;
      b.addEventListener('click', () => {
        S.ballCount = i;
        document.querySelectorAll('.count-btn')
          .forEach(x => x.classList.toggle('active', +x.dataset.n === i));
        $('setupNext').disabled = false;
      });
      grid.appendChild(b);
    }
  })();

  $('setupNext').addEventListener('click', () => {
    if (!S.ballCount) return;
    initCameraScreen();
    showScreen('camera');
  });

  /* ============================================================
     CAMERA SCREEN
  ============================================================ */
  function initCameraScreen() {
    S.photos   = [];
    S.captured = 0;
    refreshCameraUI();
    launchCamera();
  }

  function refreshCameraUI() {
    const n   = S.ballCount;
    const cur = S.captured;

    $('camTitle').textContent = cur < n
      ? `Ball ${cur + 1} of ${n}`
      : `All ${n} selfies done!`;
    $('camSub').textContent = cur < n
      ? `Selfie #${cur + 1} — look alive! 😄`
      : 'Ready to launch. Hit Start!';

    const row = $('progressRow');
    row.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div');
      d.className = 'pdot' + (i < cur ? ' done' : i === cur ? ' active' : '');
      row.appendChild(d);
    }

    const tr = $('thumbsRow');
    tr.innerHTML = '';
    for (let i = 0; i < n; i++) {
      if (S.photos[i]) {
        const wrap = document.createElement('div');
        wrap.className = 'thumb';
        const img = document.createElement('img');
        img.src = S.photos[i].src;
        wrap.appendChild(img);
        tr.appendChild(wrap);
      } else {
        const ph = document.createElement('div');
        ph.className = 'thumb-ph';
        ph.textContent = i + 1;
        tr.appendChild(ph);
      }
    }

    $('shutterBtn').disabled = cur >= n;
    $('camStart').disabled   = cur < n;
  }

  async function launchCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 320 } },
        audio: false,
      });
      S.stream = stream;
      $('camFeed').srcObject = stream;
      $('noCamNote').textContent = '';
    } catch (err) {
      console.warn('Camera unavailable:', err);
      $('noCamNote').textContent = '⚠️ No camera — emoji avatars will be used instead.';
      autoFillEmoji();
    }
  }

  function stopCamera() {
    if (S.stream) { S.stream.getTracks().forEach(t => t.stop()); S.stream = null; }
  }

  function autoFillEmoji() {
    for (let i = S.captured; i < S.ballCount; i++) S.photos[i] = makeEmojiImage(i);
    S.captured = S.ballCount;
    refreshCameraUI();
  }

  function makeEmojiImage(idx) {
    const c = document.createElement('canvas');
    c.width = c.height = 280;
    const x = c.getContext('2d');
    x.fillStyle = BALL_PALETTE[idx % BALL_PALETTE.length];
    x.fillRect(0, 0, 280, 280);
    x.font = '110px serif';
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(FACE_FALLBACK[idx % FACE_FALLBACK.length], 140, 140);
    const img = new Image();
    img.src = c.toDataURL();
    return img;
  }

  let shootCooldown = false;

  $('shutterBtn').addEventListener('click', () => {
    if (shootCooldown || S.captured >= S.ballCount) return;
    shootCooldown = true;
    runCountdown(3, () => { captureFrame(); shootCooldown = false; });
  });

  function runCountdown(from, done) {
    const ov = $('countdownOverlay');
    let n = from;
    ov.textContent = n; ov.classList.add('show');
    const iv = setInterval(() => {
      n--;
      if (n <= 0) { clearInterval(iv); ov.classList.remove('show'); done(); }
      else ov.textContent = n;
    }, 700);
  }

  function captureFrame() {
    const flash = $('camFlash');
    flash.classList.add('go');
    setTimeout(() => flash.classList.remove('go'), 180);

    const c = document.createElement('canvas');
    c.width = c.height = 280;
    const x = c.getContext('2d');
    const feed = $('camFeed');

    if (S.stream && feed.readyState >= 2) {
      x.save();
      x.translate(280, 0); x.scale(-1, 1);
      x.drawImage(feed, 0, 0, 280, 280);
      x.restore();
    } else {
      x.fillStyle = BALL_PALETTE[S.captured % BALL_PALETTE.length];
      x.fillRect(0, 0, 280, 280);
      x.font = '100px serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText(FACE_FALLBACK[S.captured % FACE_FALLBACK.length], 140, 140);
    }

    const img = new Image();
    img.src = c.toDataURL('image/jpeg', 0.88);
    S.photos[S.captured] = img;
    S.captured++;
    refreshCameraUI();

    const btn = $('shutterBtn');
    btn.style.transform = 'scale(.88)';
    setTimeout(() => (btn.style.transform = ''), 140);
  }

  $('camBack').addEventListener('click',  () => { stopCamera(); showScreen('setup'); });
  $('camStart').addEventListener('click', () => { stopCamera(); initGame(); showScreen('game'); });

  /* ============================================================
     BALL CLASS
  ============================================================ */
  class Ball {
    constructor(id, img) {
      this.id       = id;
      this.image    = img;
      this.r        = BALL_R;
      this.color    = BALL_PALETTE[id % BALL_PALETTE.length];
      this.x = 0; this.y = 0; this.vx = 0; this.vy = 0;
      this.spin     = 0;
      this.spinSpd  = (Math.random() - .5) * 6;
      this.gPhi     = Math.random() * Math.PI * 2;
      this.trail    = [];
      this.landed   = false;
      this.active   = false;
    }

    spawn() {
      this.x  = (WALL_L + WALL_R) / 2 + (Math.random() - .5) * 60;
      this.y  = -this.r * 3;
      this.vx = (Math.random() - .5) * 120;
      this.vy = 50;
      this.active = true;
    }

    update(dt) {
      if (!this.active || this.landed) return;

      this.trail.push({ x: this.x, y: this.y });
      if (this.trail.length > 10) this.trail.shift();

      this.vy  += GRAVITY * dt;
      this.x   += this.vx * dt;
      this.y   += this.vy * dt;
      this.spin += this.spinSpd * dt;
      this.vx  *= Math.pow(FRICTION, dt * 60);

      if (this.x - this.r < WALL_L) {
        this.x  = WALL_L + this.r;
        this.vx = Math.abs(this.vx) * REST + 30;
      }
      if (this.x + this.r > WALL_R) {
        this.x  = WALL_R - this.r;
        this.vx = -(Math.abs(this.vx) * REST + 30);
      }
    }

    draw(c, t) {
      if (!this.active) return;

      /* trail */
      this.trail.forEach((pt, i) => {
        const a   = (i / this.trail.length) * 0.25;
        const r   = this.r * (i / this.trail.length) * 0.5;
        const hex = Math.floor(a * 255).toString(16).padStart(2, '0');
        c.beginPath();
        c.arc(pt.x, pt.y, r, 0, Math.PI * 2);
        c.fillStyle = this.color + hex;
        c.fill();
      });

      const glow = Math.sin(t * 2.2 + this.gPhi) * 0.3 + 0.7;

      c.save();
      c.shadowColor = this.color;
      c.shadowBlur  = 16 * glow;
      c.beginPath();
      c.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      c.clip();

      if (this.image && this.image.complete && this.image.naturalWidth > 0) {
        c.translate(this.x, this.y);
        c.rotate(this.spin);
        c.drawImage(this.image, -this.r, -this.r, this.r * 2, this.r * 2);
      } else {
        c.fillStyle = this.color;
        c.fill();
      }
      c.restore();

      /* ring */
      c.save();
      c.shadowColor = this.color;
      c.shadowBlur  = 14;
      c.beginPath();
      c.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      c.strokeStyle = this.color;
      c.lineWidth   = 2.8;
      c.stroke();
      c.restore();

      /* number label */
      c.fillStyle    = 'rgba(255,255,255,.88)';
      c.font         = `bold ${Math.round(this.r * .62)}px sans-serif`;
      c.textAlign    = 'center';
      c.textBaseline = 'top';
      c.fillText(this.id + 1, this.x, this.y + this.r + 3);
    }

    hasLanded() { return this.y - this.r > CH - 80; }
  }

  /* ============================================================
     OBSTACLE GENERATION — 6 large alternating spike triangles
  ============================================================ */
  function buildObstacles() {
    return SPIKE_DEFS.map((d, i) => {
      const wx = d.side === 'left' ? WALL_L : WALL_R;
      const wallTop    = { x: wx,    y: d.cy - d.bh };
      const wallBottom = { x: wx,    y: d.cy + d.bh };
      const tip        = { x: d.tipX, y: d.cy       };

      return {
        vertices:   [wallTop, wallBottom, tip],
        faceEdges: [
          { a: wallTop,    b: tip        },
          { a: tip,        b: wallBottom },
        ],
        side:    d.side,
        cx:      d.tipX,
        cy:      d.cy,
        bh:      d.bh,
        hitT:    0,
        color:   d.color,
        label:   ['I','II','III','IV','V','VI'][i],
      };
    });
  }

  /* ============================================================
     SLOT GENERATION
  ============================================================ */
  function buildSlots() {
    const w = (WALL_R - WALL_L) / SLOT_N;
    return SLOT_MX.map((mx, i) => ({
      x:     WALL_L + i * w,
      w,
      mx,
      color: SLOT_CL[i],
      pulseT: 0,
    }));
  }

  /* ============================================================
     HIT PARTICLES
  ============================================================ */
  const hitParticles = [];

  function spawnHitParticles(x, y, color, count) {
    for (let i = 0; i < (count || 10); i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 100 + Math.random() * 220;
      hitParticles.push({
        x, y,
        vx:    Math.cos(angle) * speed,
        vy:    Math.sin(angle) * speed - 80,
        life:  1,
        size:  2.5 + Math.random() * 3.5,
        color,
      });
    }
  }

  /* ============================================================
     PHYSICS — closest point on a line segment
  ============================================================ */
  function closestPtOnSeg(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const lenSq = dx * dx + dy * dy;
    if (lenSq < 0.001) return { x: ax, y: ay };
    const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / lenSq));
    return { x: ax + t * dx, y: ay + t * dy };
  }

  /* ============================================================
     PHYSICS — ball vs spike obstacle
     Only tests the two face edges (tip faces), not the wall base.
  ============================================================ */
  function collideBallObstacle(ball, obs) {
    let hit = false;

    for (const edge of obs.faceEdges) {
      const cp = closestPtOnSeg(ball.x, ball.y, edge.a.x, edge.a.y, edge.b.x, edge.b.y);
      const dx = ball.x - cp.x;
      const dy = ball.y - cp.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < ball.r && dist > 0.001) {
        const nx = dx / dist;
        const ny = dy / dist;

        /* push ball out of overlap */
        ball.x += nx * (ball.r - dist);
        ball.y += ny * (ball.r - dist);

        /* reflect velocity along edge normal */
        const dot = ball.vx * nx + ball.vy * ny;
        if (dot < 0) {
          ball.vx -= (1 + REST) * dot * nx;
          ball.vy -= (1 + REST) * dot * ny;
        }

        /* small random horizontal kick to prevent sticking */
        ball.vx += (Math.random() - .5) * 50;

        obs.hitT = performance.now();
        spawnHitParticles(cp.x, cp.y, ball.color, 8);
        hit = true;
      }
    }
    return hit;
  }

  /* ============================================================
     PHYSICS — ball vs ball elastic collision
  ============================================================ */
  function collideBallBall(a, b) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const d2 = dx * dx + dy * dy;
    const mn = a.r + b.r;
    if (d2 >= mn * mn || d2 < 0.001) return;

    const d  = Math.sqrt(d2);
    const nx = dx / d, ny = dy / d;
    const ov = (mn - d) * .5;

    a.x -= nx * ov; a.y -= ny * ov;
    b.x += nx * ov; b.y += ny * ov;

    const dvx = a.vx - b.vx, dvy = a.vy - b.vy;
    const dot = dvx * nx + dvy * ny;
    if (dot > 0) {
      const imp = dot * REST;
      a.vx -= imp * nx; a.vy -= imp * ny;
      b.vx += imp * nx; b.vy += imp * ny;
    }
  }

  /* ============================================================
     GAME INIT
  ============================================================ */
  function initGame() {
    gameCanvas.width  = CW;
    gameCanvas.height = CH;

    S.obstacles = buildObstacles();
    S.slots     = buildSlots();
    S.allBalls  = [];
    S.liveBalls = [];
    S.results   = [];
    S.queue     = [];
    S.score     = 0;
    S.lastT     = null;
    S.nextSpawn = performance.now() + 500;
    hitParticles.length = 0;

    for (let i = 0; i < S.ballCount; i++) {
      const ball = new Ball(i, S.photos[i]);
      S.allBalls.push(ball);
      S.queue.push(ball);
    }

    updateHUD();
    if (S.raf) cancelAnimationFrame(S.raf);
    S.raf = requestAnimationFrame(gameLoop);
  }

  /* ============================================================
     BALL SPAWNING
  ============================================================ */
  function trySpawn(now) {
    if (S.liveBalls.length >= MAX_LIVE) return;
    if (!S.queue.length)               return;
    if (now < S.nextSpawn)             return;

    const ball  = S.queue.shift();
    ball.spawn();
    S.liveBalls.push(ball);
    S.nextSpawn = now + SPAWN_GAP;
    updateHUD();
  }

  /* ============================================================
     LANDING / SCORING
  ============================================================ */
  function checkLanding(ball) {
    if (ball.landed || !ball.hasLanded()) return;

    let si = 0;
    for (let i = 0; i < S.slots.length; i++) {
      if (ball.x >= S.slots[i].x && ball.x < S.slots[i].x + S.slots[i].w) { si = i; break; }
    }

    const slot   = S.slots[si];
    const points = 100 * slot.mx;

    ball.landed  = true;
    ball.active  = false;
    slot.pulseT  = performance.now();
    S.score     += points;
    S.results.push({ ball, si, points, mx: slot.mx });

    const idx = S.liveBalls.indexOf(ball);
    if (idx !== -1) S.liveBalls.splice(idx, 1);

    updateHUD();
    showScorePop(ball.x, CH - 80, `×${slot.mx}`, slot.color);
  }

  function updateHUD() {
    $('hudLeft').textContent   = S.queue.length + S.liveBalls.length;
    $('hudActive').textContent = S.liveBalls.length;
    $('hudScore').textContent  = S.score.toLocaleString();
  }

  function showScorePop(cx, cy, text, color) {
    const rect = gameCanvas.getBoundingClientRect();
    const pop  = document.createElement('div');
    pop.className       = 'score-pop';
    pop.textContent     = text;
    pop.style.color      = color;
    pop.style.textShadow = `0 0 22px ${color}`;
    pop.style.left       = (rect.left + cx) + 'px';
    pop.style.top        = (rect.top  + cy) + 'px';
    document.body.appendChild(pop);
    setTimeout(() => pop.remove(), 1400);
  }

  /* ============================================================
     MAIN GAME LOOP
  ============================================================ */
  function gameLoop(ts) {
    if (!S.lastT) S.lastT = ts;
    const dt = Math.min((ts - S.lastT) / 1000, 0.034);
    S.lastT = ts;

    trySpawn(ts);

    S.liveBalls.forEach(b => b.update(dt));

    /* ball ↔ spike collisions */
    S.liveBalls.forEach(b => S.obstacles.forEach(o => collideBallObstacle(b, o)));

    /* ball ↔ ball collisions */
    for (let i = 0; i < S.liveBalls.length; i++)
      for (let j = i + 1; j < S.liveBalls.length; j++)
        collideBallBall(S.liveBalls[i], S.liveBalls[j]);

    /* check landings */
    [...S.liveBalls].forEach(b => checkLanding(b));

    updateParticles(dt);
    render(ts / 1000);

    if (S.queue.length === 0 && S.liveBalls.length === 0) {
      setTimeout(showResults, 900);
      return;
    }

    S.raf = requestAnimationFrame(gameLoop);
  }

  /* ============================================================
     PARTICLE UPDATE
  ============================================================ */
  function updateParticles(dt) {
    for (let i = hitParticles.length - 1; i >= 0; i--) {
      const p = hitParticles[i];
      p.life -= dt * 2.0;
      p.x    += p.vx * dt;
      p.y    += p.vy * dt;
      p.vy   += 480 * dt;
      if (p.life <= 0) hitParticles.splice(i, 1);
    }
  }

  /* ============================================================
     RENDERING — master call
  ============================================================ */
  function render(t) {
    ctx.clearRect(0, 0, CW, CH);
    drawBackground(t);
    drawWalls(t);
    drawSlots(t);
    drawObstacles(t);
    drawHitParticles();
    S.allBalls.forEach(b => b.draw(ctx, t));
    drawLaunchTube(t);
  }

  /* ---- background: dark gradient + vertical light streaks for tube depth ---- */
  function drawBackground(t) {
    /* main gradient */
    const bg = ctx.createLinearGradient(0, 0, 0, CH);
    bg.addColorStop(0,   '#0c0c28');
    bg.addColorStop(.5,  '#080814');
    bg.addColorStop(1,   '#040410');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, CW, CH);

    /* vertical speed-line streaks inside tube */
    const tubeW = WALL_R - WALL_L;
    for (let i = 0; i < 7; i++) {
      const lx    = WALL_L + (i + 1) * (tubeW / 8);
      const phase = Math.sin(t * 0.6 + i * 1.1);
      const alpha = (phase * 0.04 + 0.05);
      ctx.strokeStyle = `rgba(160,180,255,${alpha})`;
      ctx.lineWidth   = 1;
      ctx.beginPath();
      ctx.moveTo(lx, 0);
      ctx.lineTo(lx, CH);
      ctx.stroke();
    }

    /* subtle center glow — the channel is "lit" */
    const cx   = (WALL_L + WALL_R) / 2;
    const glow = ctx.createRadialGradient(cx, CH * .45, 0, cx, CH * .45, tubeW * .6);
    glow.addColorStop(0,   'rgba(80,60,140,.12)');
    glow.addColorStop(1,   'transparent');
    ctx.fillStyle = glow;
    ctx.fillRect(WALL_L, 0, tubeW, CH);
  }

  /* ---- walls: thick glowing purple slabs on both sides ---- */
  function drawWalls(t) {
    const pulse = Math.sin(t * 1.6) * 0.1 + 0.65;

    ctx.save();
    ctx.shadowColor = `rgba(168,85,247,${pulse})`;
    ctx.shadowBlur  = 22;

    /* left wall slab */
    const gL = ctx.createLinearGradient(0, 0, WALL_L, 0);
    gL.addColorStop(0,   'rgba(168,85,247,.75)');
    gL.addColorStop(.6,  'rgba(168,85,247,.30)');
    gL.addColorStop(1,   'rgba(168,85,247,.10)');
    ctx.fillStyle = gL;
    ctx.fillRect(0, 0, WALL_L, CH);

    /* right wall slab */
    const gR = ctx.createLinearGradient(WALL_R, 0, CW, 0);
    gR.addColorStop(0,   'rgba(168,85,247,.10)');
    gR.addColorStop(.4,  'rgba(168,85,247,.30)');
    gR.addColorStop(1,   'rgba(168,85,247,.75)');
    ctx.fillStyle = gR;
    ctx.fillRect(WALL_R, 0, CW - WALL_R, CH);

    /* bright inner edges */
    ctx.strokeStyle = `rgba(168,85,247,${.55 + pulse * .25})`;
    ctx.lineWidth   = 2.5;
    ctx.beginPath(); ctx.moveTo(WALL_L, 0); ctx.lineTo(WALL_L, CH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(WALL_R, 0); ctx.lineTo(WALL_R, CH); ctx.stroke();
    ctx.restore();
  }

  /* ---- scoring slots at the bottom ---- */
  function drawSlots(t) {
    const TOP = CH - 82;
    const H   = 82;
    const now = performance.now();

    S.slots.forEach(slot => {
      const sinceP = (now - slot.pulseT) / 1000;
      const pulse  = slot.pulseT > 0 ? Math.max(0, 1 - sinceP * 1.6) : 0;

      ctx.save();
      if (pulse > 0) { ctx.shadowColor = slot.color; ctx.shadowBlur = 35 * pulse; }

      const g = ctx.createLinearGradient(slot.x, TOP, slot.x, TOP + H);
      g.addColorStop(0, slot.color + '40');
      g.addColorStop(1, slot.color + 'bb');
      ctx.fillStyle = g;
      ctx.fillRect(slot.x, TOP, slot.w, H);

      if (pulse > 0) {
        ctx.fillStyle = `rgba(255,255,255,${pulse * .38})`;
        ctx.fillRect(slot.x, TOP, slot.w, H);
      }
      ctx.restore();

      ctx.strokeStyle = 'rgba(255,255,255,.12)';
      ctx.lineWidth   = 1;
      ctx.strokeRect(slot.x, TOP, slot.w, H);

      ctx.save();
      ctx.shadowColor   = slot.color;
      ctx.shadowBlur    = 10;
      ctx.fillStyle     = '#fff';
      ctx.font          = `bold ${slot.w < 58 ? 12 : 14}px sans-serif`;
      ctx.textAlign     = 'center';
      ctx.textBaseline  = 'middle';
      ctx.fillText(`×${slot.mx}`, slot.x + slot.w / 2, TOP + H / 2);
      ctx.restore();
    });

    /* mini divider spikes between slots */
    ctx.fillStyle = 'rgba(200,200,240,.4)';
    for (let i = 1; i < SLOT_N; i++) {
      const x = WALL_L + i * ((WALL_R - WALL_L) / SLOT_N);
      ctx.beginPath();
      ctx.moveTo(x,     TOP);
      ctx.lineTo(x - 5, TOP - 18);
      ctx.lineTo(x + 5, TOP - 18);
      ctx.closePath();
      ctx.fill();
    }
  }

  /* ---- big spike obstacles — the main visual feature ---- */
  function drawObstacles(t) {
    const now = performance.now();

    S.obstacles.forEach(obs => {
      const sinceHit = (now - obs.hitT) / 1000;
      const hitGlow  = obs.hitT > 0 ? Math.max(0, 1 - sinceHit / 0.45) : 0;
      const idlePulse = Math.sin(t * 1.2 + S.obstacles.indexOf(obs) * 0.9) * 0.15 + 0.25;

      const [wallTop, wallBottom, tip] = obs.vertices;

      ctx.save();

      /* outer area glow */
      ctx.shadowColor = hitGlow > 0
        ? `rgba(255,255,80,${.7 + hitGlow * .3})`
        : `${obs.color}${Math.floor((idlePulse) * 255).toString(16).padStart(2,'0')}`;
      ctx.shadowBlur = hitGlow > 0 ? 40 * hitGlow : 18;

      /* spike face fill — gradient from wall to tip */
      const grad = ctx.createLinearGradient(
        wallTop.x, obs.cy,
        tip.x, tip.y
      );

      if (hitGlow > 0) {
        grad.addColorStop(0, `rgba(255,255,180,${.2 + hitGlow * .4})`);
        grad.addColorStop(1, `rgba(255,255,80,${.8 + hitGlow * .2})`);
      } else {
        /* parse the hex color to rgba */
        const r = parseInt(obs.color.slice(1,3),16);
        const g = parseInt(obs.color.slice(3,5),16);
        const b = parseInt(obs.color.slice(5,7),16);
        grad.addColorStop(0, `rgba(${r},${g},${b},.18)`);
        grad.addColorStop(.6, `rgba(${r},${g},${b},.55)`);
        grad.addColorStop(1, `rgba(${r},${g},${b},.95)`);
      }

      ctx.beginPath();
      ctx.moveTo(wallTop.x,    wallTop.y);
      ctx.lineTo(wallBottom.x, wallBottom.y);
      ctx.lineTo(tip.x,        tip.y);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      /* bright outline along the spike faces */
      ctx.beginPath();
      ctx.moveTo(wallTop.x, wallTop.y);
      ctx.lineTo(tip.x, tip.y);
      ctx.lineTo(wallBottom.x, wallBottom.y);
      ctx.strokeStyle = hitGlow > 0
        ? `rgba(255,255,100,${.9 + hitGlow * .1})`
        : obs.color + 'dd';
      ctx.lineWidth = hitGlow > 0 ? 3 : 2;
      ctx.stroke();

      /* glowing tip dot */
      ctx.shadowColor = hitGlow > 0 ? '#ffff50' : obs.color;
      ctx.shadowBlur  = hitGlow > 0 ? 30 * hitGlow : 20 * idlePulse;
      ctx.beginPath();
      ctx.arc(tip.x, tip.y, hitGlow > 0 ? 6 : 4, 0, Math.PI * 2);
      ctx.fillStyle = hitGlow > 0 ? '#ffffff' : obs.color;
      ctx.fill();

      /* interior sheen line along top face */
      const midX = (wallTop.x + tip.x) / 2;
      const midY = (wallTop.y + tip.y) / 2;
      ctx.strokeStyle = `rgba(255,255,255,${.08 + idlePulse * .06})`;
      ctx.lineWidth   = 1;
      ctx.shadowBlur  = 0;
      ctx.beginPath();
      ctx.moveTo(wallTop.x + (obs.side === 'left' ? 4 : -4), wallTop.y + 8);
      ctx.lineTo(midX, midY);
      ctx.stroke();

      ctx.restore();
    });
  }

  /* ---- render hit burst particles ---- */
  function drawHitParticles() {
    hitParticles.forEach(p => {
      const a   = Math.max(0, p.life);
      const hex = Math.floor(a * 220).toString(16).padStart(2, '0');
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
      ctx.fillStyle = p.color + hex;
      ctx.fill();
    });
  }

  /* ---- launch tube at top centre ---- */
  function drawLaunchTube(t) {
    const cx    = (WALL_L + WALL_R) / 2;
    const tubeW = 36;
    const tubeH = 60;

    ctx.save();
    const tg = ctx.createLinearGradient(cx - tubeW / 2, 0, cx + tubeW / 2, 0);
    tg.addColorStop(0,  'rgba(168,85,247,.5)');
    tg.addColorStop(.5, 'rgba(168,85,247,.14)');
    tg.addColorStop(1,  'rgba(168,85,247,.5)');
    ctx.fillStyle = tg;
    ctx.fillRect(cx - tubeW / 2, 0, tubeW, tubeH);

    const gp = Math.sin(t * 3.2) * .18 + .45;
    ctx.shadowColor = `rgba(168,85,247,${gp})`;
    ctx.shadowBlur  = 14;
    ctx.strokeStyle = `rgba(168,85,247,${.5 + gp * .35})`;
    ctx.lineWidth   = 1.5;
    ctx.strokeRect(cx - tubeW / 2, 0, tubeW, tubeH);
    ctx.restore();

    ctx.save();
    ctx.font = 'bold 9px sans-serif';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle    = 'rgba(168,85,247,.72)';
    ctx.fillText('DROP', cx, 2);
    ctx.restore();
  }

  /* ============================================================
     RESULTS SCREEN
  ============================================================ */
  function showResults() {
    $('finalScore').textContent = S.score.toLocaleString();

    const bd = $('breakdown');
    bd.innerHTML = '';

    S.results.forEach(r => {
      const slot = S.slots[r.si];
      const row  = document.createElement('div');
      row.className = 'brow';

      const av = document.createElement('div');
      av.className = 'brow-avatar';
      if (r.ball.image && r.ball.image.src) {
        const img = document.createElement('img');
        img.src = r.ball.image.src;
        av.appendChild(img);
      } else {
        av.style.background = r.ball.color;
      }

      const info = document.createElement('div');
      info.className = 'brow-info';
      const nm = document.createElement('div');
      nm.className   = 'brow-name';
      nm.textContent = `Ball ${r.ball.id + 1}`;
      const sl = document.createElement('div');
      sl.className   = 'brow-slot';
      sl.textContent = `Landed in ×${r.mx} slot`;
      sl.style.color = slot.color;
      info.appendChild(nm);
      info.appendChild(sl);

      const pts = document.createElement('div');
      pts.className   = 'brow-pts';
      pts.textContent = `+${r.points.toLocaleString()}`;
      pts.style.color = slot.color;

      row.appendChild(av);
      row.appendChild(info);
      row.appendChild(pts);
      bd.appendChild(row);
    });

    showScreen('results');
    launchConfetti();
  }

  /* ============================================================
     CONFETTI
  ============================================================ */
  const confettiPieces = [];
  let confettiRaf = null;

  function launchConfetti() {
    confettiCvs.width  = window.innerWidth;
    confettiCvs.height = window.innerHeight;
    confettiPieces.length = 0;

    const colors = ['#ff2d78','#00d4ff','#a855f7','#fbbf24','#34d399','#f97316'];
    for (let i = 0; i < 150; i++) {
      confettiPieces.push({
        x:    Math.random() * confettiCvs.width,
        y:    -10 - Math.random() * 200,
        vx:   (Math.random() - .5) * 5,
        vy:   2.5 + Math.random() * 4,
        rot:  Math.random() * Math.PI * 2,
        rotV: (Math.random() - .5) * .22,
        w:    6 + Math.random() * 8,
        h:    3 + Math.random() * 5,
        color: colors[Math.floor(Math.random() * colors.length)],
      });
    }

    if (confettiRaf) cancelAnimationFrame(confettiRaf);

    (function tick() {
      confettiCtx.clearRect(0, 0, confettiCvs.width, confettiCvs.height);
      let any = false;
      confettiPieces.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.rot += p.rotV; p.vy += 0.06;
        if (p.y < confettiCvs.height + 20) {
          any = true;
          const life = Math.max(0, 1 - p.y / (confettiCvs.height * 1.1));
          confettiCtx.save();
          confettiCtx.globalAlpha = life;
          confettiCtx.translate(p.x, p.y);
          confettiCtx.rotate(p.rot);
          confettiCtx.fillStyle = p.color;
          confettiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          confettiCtx.restore();
        }
      });
      if (any) confettiRaf = requestAnimationFrame(tick);
      else confettiCtx.clearRect(0, 0, confettiCvs.width, confettiCvs.height);
    })();
  }

  /* ============================================================
     PLAY AGAIN
  ============================================================ */
  $('playAgain').addEventListener('click', () => {
    if (confettiRaf) { cancelAnimationFrame(confettiRaf); confettiRaf = null; }
    confettiCtx.clearRect(0, 0, confettiCvs.width, confettiCvs.height);
    S.ballCount = 0;
    S.photos    = [];
    S.captured  = 0;
    document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
    $('setupNext').disabled = true;
    showScreen('setup');
  });

  /* ============================================================
     BOOT
  ============================================================ */
  showScreen('setup');
  </script>
</body>
