<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEN</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <div class="brand-icon">D</div>
          <span class="brand-name">DEN</span>
        </div>
        <button class="new-chat-btn" id="newChatBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          New chat
        </button>
      </div>
      <div class="history-list" id="historyList"></div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <span class="model-badge">DEN AI</span>
      </header>

      <!-- Welcome screen (shown when no messages) -->
      <div class="welcome" id="welcome">
        <div class="welcome-icon">D</div>
        <h1>How can I help you today?</h1>
        <p>DEN is here to assist with writing, analysis, coding, math, and more.</p>
        <div class="suggestions">
          <button class="suggestion-pill" data-text="Explain quantum entanglement in simple terms">Explain quantum entanglement</button>
          <button class="suggestion-pill" data-text="Write a Python function that sorts a list of dictionaries by a given key">Python sort dictionaries</button>
          <button class="suggestion-pill" data-text="What are the pros and cons of microservices architecture?">Microservices pros & cons</button>
          <button class="suggestion-pill" data-text="Help me write a professional email declining a job offer politely">Decline a job offer</button>
        </div>
      </div>

      <!-- Message thread -->
      <div class="messages" id="messages"></div>

      <!-- Input area -->
      <div class="input-area">
        <div class="input-box">
          <textarea
            id="userInput"
            placeholder="Message DEN…"
            rows="1"
            maxlength="32000"
          ></textarea>
          <button class="send-btn" id="sendBtn" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        <p class="disclaimer">DEN can make mistakes. Verify important information.</p>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
